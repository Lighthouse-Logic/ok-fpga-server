[server]
management_port = 9090
log_level = "info"
management_bind = "0.0.0.0"
user_timeout_secs = 60
user_sweep_interval_secs = 10
log_file = "logs/okfpga-server.log"
description = "A Dual Port Beast"

[rest]
enabled = true
bind = "0.0.0.0"
port = 8088

[grpc]
enabled = true
bind = "0.0.0.0"
port = 50051

[mqtt]
enabled = false
broker_url = "mqtt://localhost:1883"
client_id = "okfpga-server-01"
topic_prefix = "okfpga/server01"
publish_interval_secs = 5

[mdns]
enabled = true
instance_name = "okfpga-server"

[dashboard]
enabled = true
default_log_level = "info"
expose_settings = true

[auth]
provider = "none"
session_expiry_secs = 28800

[auth.local]
users = []

[auth.ldap]
url = "ldaps://ldap.example.com:636"
use_ssl = true
domain_components = [
    "example",
    "com",
]
organizational_units = ["Users"]
uid_attribute = "uid"

[access_control]
endpoint_enforcement = "enforce"

[catalog]
syzygy_boards = []
devices = []
bitfiles = []
