[server]
management_port = 9090
log_level = "info"
management_bind = "0.0.0.0"
user_timeout_secs = 60
user_sweep_interval_secs = 10
log_file = "logs/okfpga-server.log"
description = "A Dual Port Beast"

[rest]
enabled = true
bind = "0.0.0.0"
port = 8088

[grpc]
enabled = true
bind = "0.0.0.0"
port = 50051

[mqtt]
enabled = true
broker_url = "mqtt://localhost:1883"
# client_id and topic_prefix are derived automatically from the system
# hostname as "okfpga-server-<hostname>" and "okfpga/server-<hostname>".
# They are not configurable — only one ok-FPGA-Server should run per host.
# How often to check for state changes (seconds). Messages are only
# published when underlying data has changed — not on every tick.
publish_interval_secs = 5
# Maximum seconds between forced heartbeat publishes, even if no state
# has changed. Confirms the server is alive. Set to 0 to disable and
# rely solely on LWT for crash detection.
heartbeat_max_secs = 300
# Network interface name for announce URLs (ADR-031).
# If not set and only one non-loopback interface exists, it is used automatically.
# If not set and multiple interfaces exist, preferred_subnets is consulted.
# Example: "Ethernet", "eth0", "ens192"
announce_interface = ""
# Ordered list of preferred subnets (CIDR) for auto-detection when
# announce_interface is not set and multiple non-loopback interfaces exist.
# The first interface whose IPv4 address matches a listed subnet is used.
# If empty and no announce_interface is set, the first available interface is used.
preferred_subnets = []

[mdns]
enabled = true
# instance_name is auto-derived as "okfpga-server-<hostname>" at startup.
# Override here only if you need a custom name (e.g. "okfpga-lab-bench-1").

[dashboard]
enabled = true
default_log_level = "info"
expose_settings = true

[auth]
provider = "none"
session_expiry_secs = 28800

[auth.local]
users = []

[auth.ldap]
url = "ldaps://ldap.example.com:636"
use_ssl = true
domain_components = [
    "example",
    "com",
]
organizational_units = ["Users"]
uid_attribute = "uid"

[access_control]
endpoint_enforcement = "off"

[catalog]
syzygy_boards = []
devices = []
bitfiles = []
