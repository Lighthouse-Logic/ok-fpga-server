                    type: integer

  /devices/{serial}/axi/stream/reset:
    post:
      tags: [AXI Data Port]
      summary: Reset AXI Stream interface
      operationId: axiStreamReset
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: AXI Stream reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  # ---- Resources ----

  /resources:
    get:
      tags: [Resources]
      summary: List all resources
      description: Returns all resources across all programmed FPGAs with their current state.
      operationId: listResources
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
    post:
      tags: [Resources]
      summary: Create a resource
      description: |
        Creates a new resource for a programmed FPGA. The client creates resources
        after programming a bitfile, since the client knows what the bitfile
        exposes. See ADR-016 and ADR-034.

        - Omitting `endpoints` claims every Wire and Trigger endpoint
          (0x00-0x7F) exclusively (D77); `access_mode` may then be omitted or
          `exclusive` (`shared` is a 422). Pipe/BTPipe endpoints (0x80-0xBF)
          are never claimed implicitly — the server cannot tell a Pipe from a
          BTPipe at the same address — so declare them explicitly. D23 still
          applies.
        - With `endpoints`, `access_mode` is required, and each entry needs
          `access` unless `endpoints.default_access` is set.
        - Advisory registration warnings (self-overlapping address ranges,
          `ReadOnly` side-effect risks, omitted `endpoints` / Pipe coexistence)
          are returned in the response's `warnings` array when non-empty and
          enabled in `[access_control]` (Phase 45).
        - Errors carry a `conflict` object (`ProblemDetail.conflict`) when a
          machine-readable code applies.
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Resource created
          headers:
            Location:
              description: URI of the created resource (`/api/v1/resources/{resource_id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Referenced device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            Clash with existing server state: the FPGA is not programmed, a
            resource with this name already exists on the device, or the
            declaration overlaps an existing resource (`conflict.code` =
            `overlap`, naming the existing resource and item).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            Invalid request (`conflict.code` = `validation`): malformed JSON,
            missing field, unknown interface or endpoint type, endpoint type
            not matching its address, range start after end, missing
            `access`, `shared` without `endpoints`, or a non-string metadata
            value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /resources/{resource_id}:
    get:
      tags: [Resources]
      summary: Get resource details
      operationId: getResource
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Resources]
      summary: Delete a resource
      description: |
        Deletes a resource definition. Returns 409 if the resource is currently
        held by any user. Emits `ResourceDeleted` with `reason` = `client`.
        See ADR-016 and ADR-034.
      operationId: deleteResource
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204':
          description: Resource deleted
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Resource is currently held by one or more users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /resources/{resource_id}/acquire:
    post:
      tags: [Resources]
      summary: Acquire a resource
      description: |
        Acquires a resource in shared, exclusive, or read-only mode. Shared mode allows
        multiple users to hold the resource simultaneously. Exclusive mode
        grants sole access — other users' acquire requests will be denied.
        Read-only mode (ADR-026, ADR-034, D75) allows reading every covered
        item that is not `private`: WireOuts and UpdateWireOuts, TriggerOuts
        (IsTriggered, GetTriggerOutVector, UpdateTriggerOuts), PipeOut /
        BTPipeOut, register reads and AXI reads. ReadOnly holders can never
        write: no WireIn / UpdateWireIns, ActivateTriggerIn, PipeIn /
        BTPipeIn, register or AXI writes, and no ResetFPGA or AXI resets.
        UpdateTriggerOuts (and
        `update=true` on trigger reads) is denied to ReadOnly when any
        resource on the device declares a private TriggerOut.
        ReadOnly holders can join even an exclusive resource, unless the
        resource is marked `private`.

        Design rule (recommended, not enforced): a ReadOnly action should not
        change user-logic state or consume data other holders rely on.
        UpdateTriggerOuts clears the TriggerOut latches, reading a Pipe/BTPipe drains
        its FIFO, and some registers clear on read — mark any such item
        `private` if a ReadOnly read would be an unwanted side-effect.

        `mode` is optional; when omitted the resource's declared
        `access_mode` is used.
      operationId: acquireResource
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: >
                    User acquiring the resource. Should match the X-User-Id
                    header. If omitted, the server falls back to the X-User-Id
                    header value. If both are present and differ, the server
                    returns 400 Bad Request (ADR-029).
                mode:
                  type: string
                  enum: [shared, exclusive, read_only]
                  description: Requested holder mode. Defaults to the declared `access_mode`.
      responses:
        '200':
          description: Resource acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            Resource is held or locked by another user (`conflict.code` =
            `locked`), the requested mode clashes with the resource's declared
            mode or the caller's existing holding (`mode_mismatch`), or
            `read_only` was requested on a `private` resource (`private`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Invalid request body or unknown `mode` (`conflict.code` = `validation`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /resources/{resource_id}/release:
    post:
      tags: [Resources]
      summary: Release a resource
      description: Releases a previously acquired resource. If no holders remain, state returns to Available.
      operationId: releaseResource
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: >
                    User releasing the resource. Should match the X-User-Id
                    header. If omitted, the server falls back to the X-User-Id
                    header value. If both are present and differ, the server
                    returns 400 Bad Request (ADR-029).
      responses:
        '200':
          description: Resource released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /resources/{resource_id}/lock:
    post:
      tags: [Resources]
      summary: Lock a shared resource for exclusive use
      description: |
        A holder of a shared resource can temporarily lock it for exclusive use.
        Other holders remain in the holders list but cannot operate on the
        resource until it is unlocked. Only works on resources in `in_use_shared`
        state. Emits `ResourceChanged` and `ResourceLocked`.
      operationId: lockResource
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: >
                    The user requesting the lock. Must be a current holder of
                    the resource. Should match the X-User-Id header. If omitted,
                    the server falls back to the X-User-Id header value. If both
                    are present and differ, the server returns 400 Bad Request
                    (ADR-029).
      responses:
        '200':
          description: Resource locked successfully. Returns the updated resource state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            Conflict — resource is not in a lockable state (e.g., not shared,
            already locked by another user, or user is not a holder). When
            another user holds the lock, `conflict.code` = `locked`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /resources/{resource_id}/unlock:
    post:
      tags: [Resources]
      summary: Unlock a previously locked resource
      description: |
        Unlocks a resource that was previously locked via `/lock`. Only the user
        who holds the lock can unlock it. The resource returns to `in_use_shared`
        state. Emits `ResourceChanged` and `ResourceUnlocked`.
      operationId: unlockResource
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: >
                    The user who holds the lock. Should match the X-User-Id
                    header. If omitted, the server falls back to the X-User-Id
                    header value. If both are present and differ, the server
                    returns 400 Bad Request (ADR-029).
      responses:
        '200':
          description: Resource unlocked successfully. Returns the updated resource state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            Conflict — resource is not locked, or the requesting user does not
            hold the lock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ---- Users ----

  /users:
    get:
      tags: [Users]
      summary: List connected users
      operationId: listUsers
      responses:
        '200':
          description: List of user sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSession'

  /users/{user_id}:
    get:
      tags: [Users]
      summary: Get user details
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /heartbeat:
    post:
      tags: [Users]
      summary: User liveness heartbeat
      description: |
        Clients should call this periodically (at least every 24 seconds
        while idle; ADR-020 §5) to keep their session alive. With the
        default 60-second timeout (`user_timeout_secs`) one lost heartbeat
        never expires the session. The server updates the user's
        `last_seen_at` timestamp.

        If a user's heartbeat expires (no activity for the configured timeout),
        the server will automatically disconnect them and release all held
        resources. This endpoint provides an explicit ping; the implicit
        heartbeat middleware also touches the session on every REST request
        that includes an `X-User-Id` header.
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: >
                    The user identifier sending the heartbeat. Should match the
                    X-User-Id header. If omitted, the server falls back to the
                    X-User-Id header value. If both are present and differ, the
                    server returns 400 Bad Request (ADR-029).
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                    format: date-time
                    description: Server timestamp (ISO 8601) when the ping was received.
                  user_id:
                    type: string
                    description: Echoed back user ID for confirmation.
        '400':
          description: Missing or empty user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /disconnect:
    post:
      tags: [Users]
      summary: Disconnect the current user
      operationId: disconnect
      description: |
        Initiates a clean user disconnect. All resources held by this user
        (on any device) are released, the user session is removed, and a
        `user_disconnected` event is broadcast. This is the recommended way
        to end a client session.

        Unlike simply letting the heartbeat expire, this provides immediate
        cleanup — the dashboard and other clients see the change right away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: >
                    The user identifier to disconnect. Should match the X-User-Id
                    header. If omitted, the server falls back to the X-User-Id
                    header value. If both are present and differ, the server
                    returns 400 Bad Request (ADR-029).
      responses:
        '200':
          description: User disconnected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  released_resources:
                    type: integer
                    description: Number of resources that were released.
                  message:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ---- Events ----

  /events:
    get:
      tags: [Events]
      summary: Subscribe to real-time events (SSE)
      description: |
        Opens a Server-Sent Events (SSE) stream that pushes device, resource,
        user, and server lifecycle events in real time.  The stream stays open
        until the client disconnects.

        **Event types** (sent as the SSE `event:` field):
        - `DeviceAdded` — A new FPGA was connected
        - `DeviceRemoved` — An FPGA was disconnected
        - `DeviceProgrammed` — An FPGA was programmed with a bitfile
        - `ResourceChanged` — A resource's state changed (acquired, released, locked, unlocked, invalidated)
        - `UserConnected` — A new user session was created *(Phase 39)*
        - `UserDisconnected` — A user session ended *(Phase 39)*
        - `ResourceCreated` — A resource definition was registered *(Phase 39)*
        - `ResourceDeleted` — A resource definition was deleted, with a `reason` *(Phase 39, ADR-034)*
        - `ResourceLocked` — A holder locked a shared resource *(ADR-034)*
        - `ResourceUnlocked` — The lock holder unlocked a shared resource *(ADR-034)*
        - `ServerShutdown` — The server is shutting down gracefully *(Phase 39)*

        The SSE `data:` field is the event object itself (e.g.
        `{"resource_id": "…", "new_state": "in_use_shared", "timestamp": "…"}`),
        not wrapped in the event name.

        **Keep-alive:** The server sends a `:ping` comment every 15 seconds
        to prevent proxy/load-balancer timeouts.

        **Usage:**
        ```
        curl -N http://localhost:8088/api/v1/events
        ```
      operationId: watchEvents
      responses:
        '200':
          description: SSE event stream (never terminates until client disconnects)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/DeviceEvent'

# ===========================================================================
# Components
# ===========================================================================

components:

  parameters:
    serial:
      name: serial
      in: path
      required: true
      schema:
        type: string
        minLength: 10
        maxLength: 10
      description: 10-character FPGA device serial number

    settingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: Device setting key name (e.g., "SYZYGY0_PORT_STATUS")

    resourceId:
      name: resource_id
      in: path
      required: true
      schema:
        type: string
      description: Unique resource identifier

    userId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: User identifier

    serviceName:
      name: name
      in: path
      required: true
      schema:
        type: string
        enum: [rest, grpc, mqtt, mdns]
      description: Service name to operate on

  schemas:

    # ---- Common ----

    StatusResponse:
      type: object
      description: Generic status response for operations that don't return data.
      properties:
        success:
          type: boolean
        message:
          type: string

    ServiceInfo:
      type: object
      description: Status information for a manageable service (ADR-010).
      properties:
        name:
          type: string
          description: Service name (e.g., "rest", "grpc", "mqtt", "mdns")
          example: "rest"
        status:
          type: string
          description: Current service status
          enum: [running, stopped, starting, stopping, failed, not_compiled]
          example: "running"
        compiled:
          type: boolean
          description: Whether this service was compiled (feature flag enabled)
          example: true
        enabled:
          type: boolean
          description: Whether this service is enabled in the TOML config
          example: true

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs.
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type
        title:
          type: string
          description: A short, human-readable summary of the problem
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence
        conflict:
          $ref: '#/components/schemas/ResourceConflict'

    ResourceConflict:
      type: object
      description: |
        Machine-readable detail of a failed resource operation (ADR-034, D73).
        Present on resource 409 / 422 responses when one of the codes applies.
        gRPC sends the same fields as `ResourceConflictDetail` in the status
        details.
      required: [code]
      properties:
        code:
          type: string
          enum: [overlap, locked, blocked, mode_mismatch, private, validation]
          description: |
            `validation` = request error (422); every other code = clash with
            existing state (409).
        resource_id:
          type: string
          description: The existing resource involved, if any.
        resource_name:
          type: string
          description: Name of that resource, if any.
        item_type:
          type: string
          enum: [endpoint, address_range]
          description: The kind of item involved, if any.
        item:
          type: string
          description: |
            The item, e.g. `0x05` or `0x44A60000-0x44A6FFFF`. On an overlap
            this is the first entry of `items`.
        items:
          type: array
          items:
            type: string
          description: |
            Every conflicting item with the named existing resource:
            endpoints ascending (`0xNN`), then that resource's ranges in
            declaration order (`0xSTART-0xEND`). For example, a resource
            without `endpoints` registered after another one lists every
            endpoint both claim. Omitted when there is no item.

    # ---- Device ----

    DeviceInfo:
      type: object
      description: Complete device information for a connected FPGA. Maps to okTDeviceInfo.
      properties:
        serial:
          type: string
          description: 10-character serial number
        device_id:
          type: string
          description: User-settable device ID
        product_name:
          type: string
          description: Product name (e.g., "XEM8320-AU25P")
        product_id:
          type: integer
          description: OK_PRODUCT_* constant
        device_interface:
          type: string
          enum: [unknown, usb2, pcie, usb3, gen3]
        usb_speed:
          type: string
          enum: [unknown, full, high, super, ss_gen1, ss_gen2, ss_gen2x2]
        device_major_version:
          type: integer
        device_minor_version:
          type: integer
        wire_width:
          type: integer
        trigger_width:
          type: integer
        pipe_width:
          type: integer
        register_address_width:
          type: integer
        register_data_width:
          type: integer
        fpga_vendor:
          type: string
          enum: [unknown, xilinx, intel]
        dataport:
          type: string
          enum: [legacy, axi]
          description: >-
            Physical host transport type (`legacy` = OK_DATAPORT_LEGACY / FP-Gen1/2-USB,
            `axi` = OK_DATAPORT_AXI / FP-Gen3-USB). Classic endpoints work on all supported
            devices; AXI interfaces require `axi`. Devices reporting `OK_DATAPORT_UNKNOWN`
            are unsupported and omitted.
        is_front_panel_enabled:
          type: boolean
        bitfile:
          $ref: '#/components/schemas/BitfileInfo'

    BitfileInfo:
      type: object
      description: Information about a programmed bitfile.
      properties:
        filename:
          type: string
        description:
          type: string
        programmed_at:
          type: string
          format: date-time
        programmed_by:
          type: string
        file_path:
          type: string
          nullable: true
          description: Full path on the server filesystem (null for client uploads)
        md5_hash:
          type: string
          nullable: true
          description: MD5 hash of the bitfile content, hex-encoded

    DeviceSensor:
      type: object
      description: A single sensor reading from a device.
      properties:
        id:
          type: integer
        sensor_type:
          type: string
          enum: [invalid, bool, integer, float, voltage, current, temperature, fan_rpm, power]
        name:
          type: string
        description:
          type: string
        min:
          type: number
        max:
          type: number
        step:
          type: number
        value:
          type: number

    DeviceSetting:
      type: object
      description: A device setting key-value pair.
      properties:
        key:
          type: string
        value_type:
          type: string
          enum: [string, integer]
        string_value:
          type: string
        int_value:
          type: integer

    DeviceSettingValue:
      type: object
      description: Value to set for a device setting.
      properties:
        value_type:
          type: string
          enum: [string, integer]
        string_value:
          type: string
        int_value:
          type: integer

    SyzygyPort:
      type: object
      description: A SYZYGY peripheral port with DNA information.
      properties:
        index:
          type: integer
          description: 0-based port index
        port_status_mv:
          type: integer
          description: SmartVIO voltage in millivolts (0 = unpowered)
        is_populated:
          type: boolean
          description: true if a peripheral is detected
        manufacturer_name:
          type: string
        product_name:
          type: string
        product_model:
          type: string
        product_version:
          type: string
        serial_number:
          type: string

    # ---- Classic Data Port ----

    WireInRequest:
      type: object
      required: [endpoint, value]
      properties:
        endpoint:
          type: integer
          description: WireIn endpoint address (0x00-0x1F)
        value:
          type: integer
          format: int64
        mask:
          type: integer
          format: int64
          default: 4294967295
          description: Bitmask — only bits set in mask are modified (default 0xFFFFFFFF)
        auto_update:
          type: boolean
          default: true
          description: If true, calls UpdateWireIns after setting the value

    WireOutResponse:
      type: object
      properties:
        endpoint:
          type: integer
        value:
          type: integer
          format: int64

    TriggerInRequest:
      type: object
      required: [endpoint, bit]
      properties:
        endpoint:
          type: integer
          description: TriggerIn endpoint address (0x40-0x5F)
        bit:
          type: integer
          description: Bit index to trigger (0-31)

    TriggerOutResponse:
      type: object
      properties:
        endpoint:
          type: integer
        triggered:
          type: boolean
          description: |
            `IsTriggered(endpoint, mask)`: true if any bit in `mask` is set
            in the snapshot. Always false when `mask` is 0 (the default, D78).
        vector:
          type: integer
          format: int64
          description: Full 32-bit trigger vector

    PipeTransferResponse:
      type: object
      properties:
        bytes_transferred:
          type: integer
          format: int64

    RegisterEntry:
      type: object
      description: A single register address-data pair (maps to okTRegisterEntry).
      properties:
        address:
          type: integer
        data:
          type: integer

    # ---- AXI Data Port ----

    AXILiteReadRequest:
      type: object
      required: [address]
      properties:
        address:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
          description: Number of 32-bit words to read (1 for single read, >1 for bulk)
          default: 1
        timeout_ms:
          type: integer

    AXILiteReadResponse:
      type: object
      properties:
        values:
          type: array
          items:
            type: integer
        bytes_transferred:
          type: integer
          format: int64

    AXILiteWriteRequest:
      type: object
      required: [address]
      properties:
        address:
          type: integer
          format: int64
        value:
          type: integer
          description: Single value (for single write)
        values:
          type: array
          items:
            type: integer
          description: Multiple values (for bulk write)
        timeout_ms:
          type: integer

    AXIOperationStats:
      type: object
      description: Statistics returned by AXI bulk operations.
      properties:
        transfer_byte_count:
          type: integer
          format: int64
        transaction_count:
          type: integer
          format: int64

    AXIFullReadRequest:
      type: object
      required: [address, length]
      properties:
        address:
          type: integer
          format: int64
        length:
          type: integer
          format: int64
          description: Number of bytes to read
        burst:
          type: integer
        timeout_ms:
          type: integer

    AXIStreamReadRequest:
      type: object
      required: [length]
      properties:
        length:
          type: integer
          format: int64
        timeout_ms:
          type: integer

    AXIStreamWriteResponse:
      type: object
      properties:
        bytes_transferred:
          type: integer
          format: int64

    # ---- Resources ----

    CreateResourceRequest:
      type: object
      description: |
        Request body for creating a new resource (ADR-016, ADR-034).
        `access_mode` is required when `endpoints` is present; without
        `endpoints` it may be omitted (= `exclusive`) or `exclusive` (D62, D77).
      required: [name, device_serial, interfaces]
      properties:
        name:
          type: string
          description: Human-readable resource name (e.g., "xem7320-classic-counters")
        description:
          type: string
          description: Optional description of the resource
        device_serial:
          type: string
          description: Serial of the FPGA that provides this resource
        access_mode:
          type: string
          enum: [shared, exclusive]
          description: Declared mode of the resource.
        private:
          type: boolean
          default: false
          description: |
            Access rule, not visibility (D57) — when true, ReadOnly
            acquisition of the whole resource is denied. Recommended when any
            ReadOnly read of the resource could cause an unwanted side-effect
            (D75).
        interfaces:
          type: array
          minItems: 1
          items:
            type: string
            enum: [classic, axi_lite, axi_full, axi_stream]
        endpoints:
          $ref: '#/components/schemas/EndpointDeclaration'
        address_ranges:
          type: array
          description: |
            Ranges of one declaration may overlap each other; the server
            accepts this but logs a warning (setting
            `warn_range_self_overlap`). Where overlapping ranges differ in
            `private`, the private one applies to the shared addresses.
          items:
            $ref: '#/components/schemas/AddressRange'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Text-only key/value metadata (D69).

    EndpointDeclaration:
      type: object
      description: |
        Classic endpoint declaration. Omitted = every Wire and Trigger
        endpoint (0x00-0x7F), exclusive; Pipe/BTPipe endpoints must always be
        declared explicitly (D77). `{"entries": []}` = no classic endpoints.
      properties:
        default_access:
          type: string
          enum: [shared, exclusive]
          description: Mode for entries without `access` (D61). Never claims unlisted endpoints.
        entries:
          type: array
          description: |
            Each endpoint address may appear only once per declaration
            (422 otherwise, also for a Pipe and a BTPipe at the same address).
          items:
            $ref: '#/components/schemas/EndpointEntry'

    EndpointEntry:
      type: object
      description: One declared Classic endpoint. `access` is required unless `default_access` is set (D61).
      required: [address, type]
      properties:
        address:
          type: string
          pattern: '^0x[0-9A-Fa-f]{2}$'
          description: Endpoint address, e.g. `0x05` (0x00-0xBF).
        type:
          type: string
          enum: [wire_in, wire_out, trigger_in, trigger_out, pipe_in, pipe_out, bt_pipe_in, bt_pipe_out]
          description: Must match the address range of the endpoint type.
        access:
          type: string
          enum: [shared, exclusive]
        private:
          type: boolean
          default: false
          description: |
            When true, ReadOnly holders may not access this endpoint (D75).
            RECOMMENDED for TriggerOut (UpdateTriggerOuts clears the latch), PipeOut /
            BTPipeOut (a read drains the FIFO) and any endpoint whose read
            has a side-effect other holders rely on. A private TriggerOut
            also denies UpdateTriggerOuts to every ReadOnly holder on the
            device.
        description:
          type: string

    AddressRange:
      type: object
      description: One declared 32-bit address range (inclusive).
      required: [start, end, access]
      properties:
        name:
          type: string
        start:
          type: string
          description: First address, e.g. `0x44A60000`.
        end:
          type: string
          description: Last address (inclusive); must be >= `start`.
        access:
          type: string
          enum: [shared, exclusive]
        private:
          type: boolean
          default: false
          description: |
            When true, ReadOnly holders may not read this range (D75).
            RECOMMENDED for ranges containing clear-on-read registers, FIFOs
            or any address whose read has a side-effect.
        description:
          type: string

    Resource:
      type: object
      description: |
        A user-defined resource exposed by a programmed FPGA (ADR-034).
      properties:
        id:
          type: string
          description: '`{device_serial}:{name}`'
        name:
          type: string
        description:
          type: string
        device_serial:
          type: string
          description: Serial of the FPGA providing this resource
        state:
          type: string
          enum: [unavailable, initializing, available, in_use_shared, in_use_locked]
        access_mode:
          type: string
          enum: [shared, exclusive]
          description: Declared mode of the resource.
        holders:
          type: array
          items:
            $ref: '#/components/schemas/Holder'
          description: Current holders and the mode each acquired with (D37).
        locked_by:
          type: string
          description: User holding the lock (absent when not locked).
        interfaces:
          type: array
          items:
            type: string
            enum: [classic, axi_lite, axi_full, axi_stream]
        endpoints:
          $ref: '#/components/schemas/EndpointDeclaration'
        address_ranges:
          type: array
          items:
            $ref: '#/components/schemas/AddressRange'
        metadata:
          type: object
          additionalProperties:
            type: string
        private:
          type: boolean
          default: false
          description: |
            Access rule, not visibility (ADR-034, D57): when true, ReadOnly
            acquisition is denied. Every user can still list and read the
            resource description. Recommended when any ReadOnly read of the
            resource could cause an unwanted side-effect (D75).
        warnings:
          type: array
          readOnly: true
          items:
            type: string
          description: |
            Registration-time advisory warnings (self-overlapping address
            ranges, ReadOnly side-effect risks, omitted `endpoints` / Pipe
            coexistence). Returned by `POST /resources` (`201 Created`) when
            non-empty; omitted when empty and on `GET /resources`,
            `GET /resources/{resource_id}`, `acquire`, `lock`, and `unlock`
            responses (Phase 45).

    Holder:
      type: object
      description: One holder of a resource.
      required: [user_id, mode]
      properties:
        user_id:
          type: string
        mode:
          type: string
          enum: [shared, exclusive, read_only]

    # ---- Users ----

    UserSession:
      type: object
      description: A connected user and their held resources.
      properties:
        user_id:
          type: string
        connected_at:
          type: string
          format: date-time
        held_resource_ids:
          type: array
          items:
            type: string
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/Holding'
          description: Held resources with mode and lock flag (ADR-034).

    Holding:
      type: object
      description: One resource held by a user.
      required: [resource_id, mode, locked]
      properties:
        resource_id:
          type: string
        mode:
          type: string
          enum: [shared, exclusive, read_only]
        locked:
          type: boolean
          description: True if this user holds the resource's lock.

    # ---- Server ----

    ServerStatus:
      type: object
      description: Server status information returned by GET /server/status.
      properties:
        server_version:
          type: string
          description: ok-fpga-server version (from Cargo.toml)
        openapi_version:
          type: string
          description: OpenAPI spec version (api/openapi.yaml info.version)
        frontpanel_version:
          type: string
          description: FrontPanel DLL version string (e.g., "6.1.0")
          nullable: true
        platform:
          type: string
          description: Server platform (e.g., "windows-x86_64", "linux-aarch64")
        description:
          type: string
          description: Server description from TOML config
        uptime:
          type: string
          description: Human-readable uptime (e.g., "2h 15m 30s")
        uptime_seconds:
          type: integer
          format: int64
          description: Uptime in seconds
        connected_devices:
          type: integer
          description: Number of connected FPGA devices
        active_resources:
          type: integer
          description: Number of registered resources
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceInfo'
          description: Status of all managed services (REST, gRPC, MQTT, mDNS)

    LogEntry:
      type: object
      description: A structured log entry streamed via SSE.
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [TRACE, DEBUG, INFO, WARN, ERROR]
        target:
          type: string
          description: Module path that produced the log
        message:
          type: string
        fields:
          type: object
          additionalProperties: true

    # ---- Events ----

    DeviceEvent:
      description: |
        A real-time event sent via SSE.  The SSE `event:` field carries the
        variant name (`DeviceAdded`, `DeviceRemoved`, `DeviceProgrammed`,
        `ResourceChanged`, `UserConnected`, `UserDisconnected`,
        `ResourceCreated`, `ResourceDeleted`, `ResourceLocked`,
        `ResourceUnlocked`, `ServerShutdown`).
        The SSE `data:` field carries the variant's JSON object directly (see
        `oneOf` variants below).
      oneOf:
        - $ref: '#/components/schemas/DeviceAddedEvent'
        - $ref: '#/components/schemas/DeviceRemovedEvent'
        - $ref: '#/components/schemas/DeviceProgrammedEvent'
        - $ref: '#/components/schemas/ResourceChangedEvent'
        - $ref: '#/components/schemas/UserConnectedEvent'
        - $ref: '#/components/schemas/UserDisconnectedEvent'
        - $ref: '#/components/schemas/ResourceCreatedEvent'
        - $ref: '#/components/schemas/ResourceDeletedEvent'
        - $ref: '#/components/schemas/ResourceLockedEvent'
        - $ref: '#/components/schemas/ResourceUnlockedEvent'
        - $ref: '#/components/schemas/ServerShutdownEvent'

    DeviceAddedEvent:
      type: object
      description: Fired when a new FPGA device is connected.
      required: [serial, product_name, interface, timestamp]
      properties:
        serial:
          type: string
          description: Serial number of the newly connected device.
        product_name:
          type: string
          description: Product name (e.g., "XEM8320-AU25P").
        interface:
          type: string
          description: Device interface type (e.g., "USB 3.0").
        timestamp:
          type: string
          format: date-time

    DeviceRemovedEvent:
      type: object
      description: Fired when a device is disconnected.
      required: [serial, timestamp]
      properties:
        serial:
          type: string
        timestamp:
          type: string
          format: date-time

    DeviceProgrammedEvent:
      type: object
      description: Fired when an FPGA is successfully programmed.
      required: [serial, bitfile, programmed_by, timestamp]
      properties:
        serial:
          type: string
        bitfile:
          type: string
          description: Name of the bitfile that was loaded.
        programmed_by:
          type: string
          description: User who programmed the device.
        timestamp:
          type: string
          format: date-time

    ResourceChangedEvent:
      type: object
      description: Fired when a resource's state changes.
      required: [resource_id, new_state, timestamp]
      properties:
        resource_id:
          type: string
        new_state:
          type: string
          description: New resource state (e.g., "available", "in_use_shared", "unavailable").
        timestamp:
          type: string
          format: date-time

    # ── Phase 39 (ADR-030) event types ──────────────────────────

    UserConnectedEvent:
      type: object
      description: Fired when a new user session is created (first API call).
      required: [user_id, timestamp]
      properties:
        user_id:
          type: string
          description: The user who connected.
        timestamp:
          type: string
          format: date-time

    UserDisconnectedEvent:
      type: object
      description: |
        Fired when a user session ends, either by explicit disconnect or
        heartbeat timeout (sweep expiration).
      required: [user_id, reason, timestamp]
      properties:
        user_id:
          type: string
          description: The user who disconnected.
        reason:
          type: string
          enum: [explicit, timeout]
          description: Why the session ended.
        timestamp:
          type: string
          format: date-time

    ResourceCreatedEvent:
      type: object
      description: Fired when a new resource definition is registered.
      required: [resource_id, device_serial, name, timestamp]
      properties:
        resource_id:
          type: string
          description: The newly created resource ID (format device_serial:name).
        device_serial:
          type: string
          description: The device this resource belongs to.
        name:
          type: string
          description: Human-readable resource name.
        timestamp:
          type: string
          format: date-time

    ResourceDeletedEvent:
      type: object
      description: Fired when a resource definition is deleted.
      required: [resource_id, reason, timestamp]
      properties:
        resource_id:
          type: string
        reason:
          type: string
          enum: [client, reprogram, clear, device_removed]
          description: |
            Why it was deleted (D58, 44-F Q2): `client` = a client deleted it;
            `reprogram` / `clear` = forced cleanup when the FPGA was
            reprogrammed or cleared; `device_removed` = forced cleanup when the
            physical device disconnected or was swept as absent.
        timestamp:
          type: string
          format: date-time

    # ── ADR-034 event types ──

    ResourceLockedEvent:
      type: object
      description: Fired when a holder locks a shared resource.
      required: [resource_id, user_id, timestamp]
      properties:
        resource_id:
          type: string
        user_id:
          type: string
          description: The user who took the lock.
        timestamp:
          type: string
          format: date-time

    ResourceUnlockedEvent:
      type: object
      description: Fired when the lock holder unlocks a shared resource.
      required: [resource_id, user_id, timestamp]
      properties:
        resource_id:
          type: string
        user_id:
          type: string
          description: The user who released the lock.
        timestamp:
          type: string
          format: date-time

    ServerShutdownEvent:
      type: object
      description: Fired when the server is shutting down gracefully.
      required: [reason, timestamp]
      properties:
        reason:
          type: string
          enum: [signal]
          description: Why the server is shutting down.
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication. Disabled by default (no-auth mode).
        Enable via config: auth.provider = "local" or "ldap".
