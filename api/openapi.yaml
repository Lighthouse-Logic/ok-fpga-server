openapi: 3.0.0

info:
  title: ok-FPGA-Server API
  version: 1.0.0
  description: |
    REST API for remote management of Opal Kelly FPGAs via the FrontPanel 6.1.0 C API.
    Supports USB 3.0, PCIe, and Gen3 devices only. USB 2.0 devices are filtered out.
    
    The API provides:
    - Device discovery with hot-plug detection (via SSE events)
    - Full FrontPanel data port operations (Classic wire/trigger/pipe/register, AXI Lite/Full/Stream)
    - Device sensors, settings, and SYZYGY peripheral discovery
    - Multi-user resource management with shared/exclusive locking
    - Bitfile programming and tracking
    - Server status, restart, and log streaming
  license:
    name: MIT
  contact:
    name: Lighthouse Logic

servers:
  - url: http://localhost:8088/api/v1
    description: Local development server

# Root-level security: empty array means no auth required by default.
# This matches ADR-008 (NoAuth provider is the default).
# Individual endpoints can override this when auth stubs are enabled.
security:
  - {}
  - basicAuth: []

tags:
  - name: Server
    description: Server status, restart, and log streaming
  - name: Devices
    description: Device discovery, info, sensors, settings, SYZYGY, and configuration
  - name: Classic Data Port
    description: FrontPanel Classic wire, trigger, pipe, and register operations
  - name: AXI Data Port
    description: FrontPanel AXI Lite, Full, and Stream operations
  - name: Resources
    description: Multi-user resource management (acquire, release, state tracking)
  - name: Users
    description: Connected user sessions
  - name: Events
    description: Real-time event streaming via Server-Sent Events (SSE)

# ===========================================================================
# Paths
# ===========================================================================

paths:

  # ---- Server ----

  /server/status:
    get:
      tags: [Server]
      summary: Get server status
      description: Returns server version, uptime, FrontPanel DLL version, platform info, and connected device count.
      operationId: getServerStatus
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatus'

  /server/restart:
    post:
      tags: [Server]
      summary: Restart the server
      description: Initiates a graceful server restart. All resources are released and all client connections are closed.
      operationId: restartServer
      responses:
        '202':
          description: Restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /server/logs:
    get:
      tags: [Server]
      summary: Stream server logs (SSE)
      description: |
        Returns a Server-Sent Events stream of log entries as they are produced.
        Each event has type `log` and data is a JSON LogEntry object.
      operationId: streamServerLogs
      responses:
        '200':
          description: SSE stream of log entries
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LogEntry'

  /server/services:
    get:
      tags: [Server]
      summary: List all manageable services
      description: |
        Returns the status of all manageable services (REST, gRPC, MQTT, mDNS).
        Each service entry includes whether it is compiled, enabled, and running.
        See ADR-010 for the ServiceManager architecture.
      operationId: listServices
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceInfo'

  /server/services/{name}/start:
    post:
      tags: [Server]
      summary: Start a stopped service
      description: |
        Start a service that is currently stopped. Returns an error if the
        service is already running, not compiled (feature flag not enabled),
        or the service name is not recognized.
      operationId: startService
      parameters:
        - $ref: '#/components/parameters/serviceName'
      responses:
        '200':
          description: Service started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
        '400':
          description: Service not compiled or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Service is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /server/services/{name}/stop:
    post:
      tags: [Server]
      summary: Stop a running service
      description: |
        Gracefully stop a running service. Returns an error if the service
        is not currently running. If the REST service stops itself via this
        endpoint, the response is sent before the service shuts down.
      operationId: stopService
      parameters:
        - $ref: '#/components/parameters/serviceName'
      responses:
        '200':
          description: Service stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
        '400':
          description: Service not compiled or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Service is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /server/services/{name}/restart:
    post:
      tags: [Server]
      summary: Restart a service
      description: |
        Restart a service (stop then start). If the REST service restarts
        itself via this endpoint, a 202 Accepted is returned and the restart
        occurs after the response is sent.
      operationId: restartService
      parameters:
        - $ref: '#/components/parameters/serviceName'
      responses:
        '202':
          description: Restart initiated (self-restart) or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
        '400':
          description: Service not compiled or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ---- Devices ----

  /devices:
    get:
      tags: [Devices]
      summary: List all connected FPGA devices
      description: Returns info for all connected, supported FPGA devices. USB 2.0 devices are excluded.
      operationId: listDevices
      responses:
        '200':
          description: List of connected devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceInfo'

  /devices/{serial}:
    get:
      tags: [Devices]
      summary: Get device information
      description: Returns full device information for the specified FPGA, including okTDeviceInfo fields and current bitfile status.
      operationId: getDeviceInfo
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: Device information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/sensors:
    get:
      tags: [Devices]
      summary: Read device sensor values
      description: Returns all sensor readings (voltage, temperature, current, power, etc.) for the specified device.
      operationId: getDeviceSensors
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: Sensor readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  sensors:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceSensor'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/settings:
    get:
      tags: [Devices]
      summary: List all device settings
      description: Returns all device settings as key-value pairs for the specified device.
      operationId: getDeviceSettings
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: Device settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceSetting'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/settings/{key}:
    get:
      tags: [Devices]
      summary: Read a single device setting
      description: Returns the value of a specific device setting by key name.
      operationId: getDeviceSetting
      parameters:
        - $ref: '#/components/parameters/serial'
        - $ref: '#/components/parameters/settingKey'
      responses:
        '200':
          description: Setting value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSetting'
        '404':
          description: Device or setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [Devices]
      summary: Update a device setting
      description: Sets the value of a specific device setting by key name.
      operationId: setDeviceSetting
      parameters:
        - $ref: '#/components/parameters/serial'
        - $ref: '#/components/parameters/settingKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSettingValue'
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Device or setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/syzygy:
    get:
      tags: [Devices]
      summary: Discover SYZYGY ports
      description: |
        Auto-discovers all SYZYGY peripheral ports on the device by probing
        DeviceSettings keys (SYZYGYn_PORT_STATUS, SYZYGYn_MANUFACTURER_NAME, etc.).
        Returns info about each port including SmartVIO voltage and peripheral DNA.
      operationId: getSyzygyPorts
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: SYZYGY port information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ports:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyzygyPort'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/configure:
    post:
      tags: [Devices]
      summary: Program the FPGA with an uploaded bitfile
      description: |
        Uploads and programs a bitfile to the specified FPGA via multipart file
        upload. The bitfile binary is sent as the `bitfile` form field.

        Programming is a **forced override** (ADR-034, D26): all locks on the
        device's resources are ended (`ResourceUnlocked`), all holders are
        released, and all existing resources on the device are deleted
        (`ResourceDeleted` with `reason: reprogram`) before programming. If the
        hardware configuration fails, the device transitions to `Connected`
        (unprogrammed). After successful programming, the device transitions to
        `Programmed` and new resources can be created.

        For server-side path programming (bitfile already on the server's
        filesystem), use `POST /devices/{serial}/configure_from_server_path`
        instead.

        User identification is provided via both the `user_id` form field and
        the `X-User-Id` header. Both should be set to the same value. The
        `user_id` field makes the API self-documenting in OpenAPI/Swagger UI;
        the `X-User-Id` header is used by the server's access control middleware.
      operationId: configureFPGA
      parameters:
        - $ref: '#/components/parameters/serial'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bitfile]
              properties:
                bitfile:
                  type: string
                  format: binary
                  description: The .bit or .rbf bitfile to program
                filename:
                  type: string
                  description: Original filename of the bitfile (optional)
                description:
                  type: string
                  description: Optional description of the bitfile
                user_id:
                  type: string
                  description: >
                    User performing the programming. Should match the X-User-Id
                    header. If omitted, the server falls back to the X-User-Id
                    header value. If both are present and differ, the server
                    returns 400 Bad Request (ADR-029).
      responses:
        '200':
          description: FPGA configured successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitfileInfo'
        '400':
          description: Invalid bitfile or FPGA configuration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Devices]
      summary: Clear FPGA configuration
      description: |
        Un-programs the FPGA (`ClearFPGAConfiguration`). This is a **forced
        override** (ADR-034, D26): all locks on the device's resources are
        ended (`ResourceUnlocked`), all holders are released, and all existing
        resources on the device are deleted (`ResourceDeleted` with
        `reason: clear`) before the configuration is cleared.
      operationId: clearFPGAConfiguration
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: FPGA configuration cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/configure_from_server_path:
    post:
      tags: [Devices]
      summary: Program the FPGA from a server-side file path
      description: |
        Programs the FPGA using a bitfile that already exists on the server's
        filesystem. The client sends only the path; the server reads and programs
        the file directly.

        Programming is a **forced override** (ADR-034, D26): all locks on the
        device's resources are ended (`ResourceUnlocked`), all holders are
        released, and all existing resources on the device are deleted
        (`ResourceDeleted` with `reason: reprogram`) before programming. If the
        hardware configuration fails, the device transitions to `Connected`
        (unprogrammed).

        For uploading a bitfile from the client machine, use
        `POST /devices/{serial}/configure` with `multipart/form-data` instead.

        User identification is provided via both the `user_id` JSON field and
        the `X-User-Id` header. Both should be set to the same value.
      operationId: configureFPGAFromServerPath
      parameters:
        - $ref: '#/components/parameters/serial'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bitfile_path]
              properties:
                bitfile_path:
                  type: string
                  description: Path to the bitfile on the server's filesystem
                description:
                  type: string
                  description: Optional description of the bitfile
                user_id:
                  type: string
                  description: >
                    User performing the programming. Should match the X-User-Id
                    header. If omitted, the server falls back to the X-User-Id
                    header value. If both are present and differ, the server
                    returns 400 Bad Request (ADR-029).
      responses:
        '200':
          description: FPGA configured successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitfileInfo'
        '400':
          description: Invalid path or FPGA configuration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/bitfile:
    get:
      tags: [Devices]
      summary: Get current bitfile information
      description: Returns info about the bitfile currently loaded on the FPGA (if any).
      operationId: getBitfileInfo
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: Bitfile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitfileInfo'
        '404':
          description: Device not found or no bitfile loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/dataport:
    get:
      tags: [Devices]
      summary: Get data port type
      description: |
        Returns the physical host interface (transport layer) type for this device
        (`okTDeviceInfo.dataport`).

        - `legacy`: `OK_DATAPORT_LEGACY` — FP-Gen1/2-USB transport (e.g., XEM7320, XEM8320).
          Supports Classic endpoints only; AXI interfaces are unavailable.
        - `axi`: `OK_DATAPORT_AXI` — FP-Gen3-USB transport (e.g., XEM8305, XEM8310, XEM8350, XEM8370).
          Supports both Classic endpoints and AXI interfaces.

        `dataport` does **not** determine whether Classic endpoints exist: Classic endpoints
        (`wire_in`, `wire_out`, `trigger_in`, `trigger_out`, `pipe_in`, `pipe_out`, `register`)
        are available on all supported devices when instantiated by the loaded bitfile.
        Devices reporting `OK_DATAPORT_UNKNOWN` are unsupported and filtered out.
      operationId: getDataportType
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: Data port type
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataport:
                    type: string
                    enum: [legacy, axi]
                    description: >-
                      Physical host transport type (`legacy` = OK_DATAPORT_LEGACY / FP-Gen1/2-USB,
                      `axi` = OK_DATAPORT_AXI / FP-Gen3-USB). Does not decide whether Classic
                      endpoints exist.

  # ---- Classic Data Port ----

  /devices/{serial}/classic/wires/in:
    put:
      tags: [Classic Data Port]
      summary: Set WireIn value
      description: |
        Sets a WireIn endpoint value with an optional bitmask and optionally
        triggers UpdateWireIns. This is an idempotent state assignment (PUT)
        per ADR-015 — setting endpoint 0x00 to value 0xFF produces the same
        hardware state regardless of how many times it is called.
      operationId: setWireInValue
      parameters:
        - $ref: '#/components/parameters/serial'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireInRequest'
      responses:
        '200':
          description: WireIn value set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid endpoint address or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/classic/wires/in/update:
    post:
      tags: [Classic Data Port]
      summary: Push buffered WireIn values (UpdateWireIns)
      description: |
        Calls UpdateWireIns, sending every buffered WireIn value to the FPGA.
        This is a **write** (ADR-034, D42): it needs write access to the
        WireIns.
      operationId: updateWireIns
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: WireIns updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /devices/{serial}/classic/wires/out/update:
    post:
      tags: [Classic Data Port]
      summary: Refresh WireOut values (UpdateWireOuts)
      description: |
        Calls UpdateWireOuts, copying the current value of every WireOut on the
        device into the device's snapshot (one snapshot per device, shared by
        all clients). This is a **read** (ADR-034, D42): ReadOnly holders may
        call it. It only samples the WireOut inputs; the FPGA's user logic
        cannot detect it (D75).
      operationId: updateWireOuts
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: WireOuts refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /devices/{serial}/classic/wires/out:
    get:
      tags: [Classic Data Port]
      summary: Read one WireOut value
      description: |
        Opal Kelly `GetWireOutValue` semantics (ADR-034 §9, D76): returns the
        value of **one** WireOut from the device snapshot taken by the last
        UpdateWireOuts call by **any** client. With `update=true` the server
        calls UpdateWireOuts immediately before the read, under the same
        device lock, so no other client's update can come in between.

        There is no whole-bank read: `endpoint` is required (422 if missing).
        ReadOnly holders may call this unless the endpoint is private (D75).
      operationId: getWireOutValue
      parameters:
        - $ref: '#/components/parameters/serial'
        - name: endpoint
          in: query
          required: true
          schema:
            type: integer
          description: WireOut endpoint address (0x20-0x3F).
        - name: update
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Refresh the snapshot (UpdateWireOuts) immediately before reading.
            Default `false` = read the current snapshot only.
      responses:
        '200':
          description: WireOut value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireOutResponse'
        '422':
          description: Missing `endpoint` (whole-bank reads are not supported)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/classic/triggers/in:
    post:
      tags: [Classic Data Port]
      summary: Activate a TriggerIn
      description: Fires a single trigger bit on the specified TriggerIn endpoint.
      operationId: activateTriggerIn
      parameters:
        - $ref: '#/components/parameters/serial'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerInRequest'
      responses:
        '200':
          description: Trigger activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /devices/{serial}/classic/triggers/out/update:
    post:
      tags: [Classic Data Port]
      summary: Refresh TriggerOut state (UpdateTriggerOuts)
      description: |
        Calls UpdateTriggerOuts. Opal Kelly: "query the XEM to determine if
        any TriggerOuts have been activated since the last call". The result
        goes into the device snapshot (shared by all clients) and the latches
        of **every** TriggerOut on the device are cleared, so a trigger that
        another client has not read yet is lost to that client. Coordinate
        trigger reads between clients (lock, exclusive resource) or mark the
        TriggerOuts private (guide §5.4). A future server-side TriggerOut
        event log may improve this (roadmap, Later).

        This is a **read** (ADR-034, D42). ReadOnly holders may call it,
        except when any resource on the device declares a private TriggerOut
        (D75): the call would clear that private latch too.
      operationId: updateTriggerOuts
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: TriggerOuts refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /devices/{serial}/classic/triggers/out:
    get:
      tags: [Classic Data Port]
      summary: Read one TriggerOut
      description: |
        Opal Kelly `IsTriggered` + `GetTriggerOutVector` semantics (ADR-034
        §9, D76): reports, for **one** TriggerOut, the triggers seen by the
        last UpdateTriggerOuts call by **any** client (one snapshot per
        device). This read never touches the FPGA and clears nothing.

        With `update=true` the server calls UpdateTriggerOuts immediately
        before the read, under the same device lock, so no other client's
        update can come in between. That update clears the latches of
        **every** TriggerOut on the device for every client (see
        `POST …/triggers/out/update`).

        **Limitation:** a client cannot tell how many updates (by other
        clients) happened since its own previous read, so a trigger can be
        missed when several clients update. Clients that need every trigger
        must coordinate (lock, exclusive resource) until the planned
        TriggerOut event log exists (roadmap, Later).

        There is no whole-bank read: `endpoint` is required (422 if missing).
        ReadOnly holders may call this unless the endpoint is private; with
        `update=true` the UpdateTriggerOuts rule above also applies (D75).
      operationId: getTriggerOutValue
      parameters:
        - $ref: '#/components/parameters/serial'
        - name: endpoint
          in: query
          required: true
          schema:
            type: integer
          description: TriggerOut endpoint address (0x60-0x7F).
        - name: mask
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: |
            Bits to test for `triggered` (Opal Kelly `IsTriggered` mask).
            **Default 0** (D78): with no mask, `triggered` is always
            `false`. Set the mask to exactly the bits you care about. An
            all-ones mask would make a client look correct while also
            reporting `triggered` for unrelated bits. `vector` always
            holds the full 32-bit vector.
        - name: update
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Refresh the snapshot (UpdateTriggerOuts) immediately before
            reading. Default `false` = read the current snapshot only.
      responses:
        '200':
          description: TriggerOut result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerOutResponse'
        '422':
          description: Missing `endpoint` (whole-bank reads are not supported)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{serial}/classic/pipes/in:
    post:
      tags: [Classic Data Port]
      summary: Write to PipeIn
      description: Writes data to a PipeIn endpoint. Data is sent as raw bytes in the request body.
      operationId: writeToPipeIn
      parameters:
        - $ref: '#/components/parameters/serial'
        - name: endpoint
          in: query
          required: true
          schema:
            type: integer
          description: PipeIn endpoint address (0x80-0x9F)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Pipe write result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipeTransferResponse'

  /devices/{serial}/classic/pipes/out:
    get:
      tags: [Classic Data Port]
      summary: Read from PipeOut
      description: Reads data from a PipeOut endpoint.
      operationId: readFromPipeOut
      parameters:
        - $ref: '#/components/parameters/serial'
        - name: endpoint
          in: query
          required: true
          schema:
            type: integer
          description: PipeOut endpoint address (0xA0-0xBF)
        - name: length
          in: query
          required: true
          schema:
            type: integer
          description: Number of bytes to read
      responses:
        '200':
          description: Pipe data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /devices/{serial}/classic/pipes/block-in:
    post:
      tags: [Classic Data Port]
      summary: Write to BlockPipeIn
      description: Writes data to a BlockPipeIn endpoint with the specified block size.
      operationId: writeToBlockPipeIn
      parameters:
        - $ref: '#/components/parameters/serial'
        - name: endpoint
          in: query
          required: true
          schema:
            type: integer
        - name: block_size
          in: query
          required: true
          schema:
            type: integer
          description: Block size in bytes
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Block pipe write result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipeTransferResponse'

  /devices/{serial}/classic/pipes/block-out:
    get:
      tags: [Classic Data Port]
      summary: Read from BlockPipeOut
      description: Reads data from a BlockPipeOut endpoint with the specified block size.
      operationId: readFromBlockPipeOut
      parameters:
        - $ref: '#/components/parameters/serial'
        - name: endpoint
          in: query
          required: true
          schema:
            type: integer
        - name: block_size
          in: query
          required: true
          schema:
            type: integer
        - name: length
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Block pipe data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /devices/{serial}/classic/registers/read:
    post:
      tags: [Classic Data Port]
      summary: Read registers
      description: Reads one or more registers by address. Supports single and bulk reads.
      operationId: readRegisters
      parameters:
        - $ref: '#/components/parameters/serial'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addresses]
              properties:
                addresses:
                  type: array
                  items:
                    type: integer
                  description: List of register addresses to read
      responses:
        '200':
          description: Register values
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegisterEntry'

  /devices/{serial}/classic/registers/write:
    put:
      tags: [Classic Data Port]
      summary: Write registers
      description: |
        Writes one or more register address-data pairs. This is an idempotent
        state assignment (PUT) per ADR-015 — writing address 0x04 = 0xDEADBEEF
        produces the same hardware state regardless of repetition.
      operationId: writeRegisters
      parameters:
        - $ref: '#/components/parameters/serial'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/RegisterEntry'
      responses:
        '200':
          description: Registers written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /devices/{serial}/classic/reset:
    post:
      tags: [Classic Data Port]
      summary: Reset FPGA
      description: |
        Issues a FrontPanel reset to the FPGA. This changes user-logic state,
        so it counts as a write: the caller must hold a resource on the
        device in a mode other than ReadOnly (D66, D75).
      operationId: resetFPGAClassic
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: FPGA reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  # ---- AXI Data Port ----

  /devices/{serial}/axi/lite/read:
