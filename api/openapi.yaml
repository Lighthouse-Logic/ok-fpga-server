          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AXILiteReadResponse'

  /devices/{serial}/axi/lite/write:
    put:
      tags: [AXI Data Port]
      summary: AXI Lite write
      description: |
        Writes a single 32-bit value or bulk values to an AXI Lite address.
        This is an idempotent state assignment (PUT) per ADR-015.
      operationId: axiLiteWrite
      parameters:
        - $ref: '#/components/parameters/serial'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AXILiteWriteRequest'
      responses:
        '200':
          description: AXI Lite write result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AXIOperationStats'

  /devices/{serial}/axi/lite/reset:
    post:
      tags: [AXI Data Port]
      summary: Reset AXI Lite interface
      operationId: axiLiteReset
      parameters:
        - $ref: '#/components/parameters/serial'
      responses:
        '200':
          description: AXI Lite reset
          content:
            application/json:
