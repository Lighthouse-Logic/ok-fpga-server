[package]
name = "rust-grpc-gui-common"
version = "0.1.0"
edition = "2021"
description = "Shared gRPC API client for ok-FPGA-Server GUI demos"
authors = ["Lighthouse Logic"]
license = "MIT"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-stream = "0.1"
mdns-sd = "0.13"

[build-dependencies]
tonic-build = "0.13"
