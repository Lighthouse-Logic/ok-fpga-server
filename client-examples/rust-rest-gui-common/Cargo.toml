[package]
name = "rust-rest-gui-common"
version = "0.1.0"
edition = "2021"
description = "Shared REST API client for ok-FPGA-Server GUI demos"
authors = ["Lighthouse Logic <admin@lighthouselogic.dev>"]
license = "GPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mdns-sd = "0.13"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
