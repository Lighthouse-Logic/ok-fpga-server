[package]
name = "rust-rest-gui-common"
version = "0.1.0"
edition = "2021"
description = "Shared REST API client for ok-FPGA-Server GUI demos"
authors = ["Lighthouse Logic"]
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
