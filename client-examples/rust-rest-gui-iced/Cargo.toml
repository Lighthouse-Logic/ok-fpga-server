[package]
name = "rust-rest-gui-iced"
version = "0.1.0"
edition = "2021"
description = "Interactive Counters.bit GUI demo — Rust REST + iced (Icy Rester)"
authors = ["Lighthouse Logic <admin@lighthouselogic.dev>"]
license = "GPL-3.0-or-later"

[dependencies]
# Shared API client for Counters.bit demo
rust-rest-gui-common = { path = "../rust-rest-gui-common" }

# GUI framework — Elm-architecture, retained-mode, polished look
iced = { version = "0.14", features = ["tokio"] }

# Async runtime — needed for REST API calls
tokio = { version = "1", features = ["full"] }

# JSON handling
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Headless GUI testing framework (iced 0.14)
[dev-dependencies]
iced_test = "0.14"
