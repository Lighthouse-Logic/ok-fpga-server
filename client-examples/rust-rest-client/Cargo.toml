[package]
name = "rust-rest-client"
version = "0.1.0"
edition = "2021"
description = "Example Rust REST client for ok-FPGA-Server"
authors = ["Lighthouse Logic"]
license = "MIT"

[dependencies]
# HTTP client — modern async HTTP with connection pooling
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization for JSON request/response bodies
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# mDNS/DNS-SD discovery — browse for _okfpga._tcp.local.
mdns-sd = "0.11"

# MQTT client — publish connection status to broker
rumqttc = "0.24"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling — derive macro for Error trait
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config file support
toml = "0.8"
