[package]
name = "rust-grpc-gui-iced"
version = "0.1.0"
edition = "2021"
description = "Interactive Counters.bit GUI demo — Rust gRPC + iced (Icy Garpac)"
authors = ["Lighthouse Logic"]
license = "MIT"

[dependencies]
rust-grpc-gui-common = { path = "../rust-grpc-gui-common" }
iced = { version = "0.13", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
