[package]
name = "rust-grpc-gui-iced"
version = "0.1.0"
edition = "2021"
description = "Interactive Counters.bit GUI demo — Rust gRPC + iced (Icy Garpac)"
authors = ["Lighthouse Logic <admin@lighthouselogic.dev>"]
license = "GPL-3.0-or-later"

[dependencies]
rust-grpc-gui-common = { path = "../rust-grpc-gui-common" }
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Headless GUI testing framework (iced 0.14)
[dev-dependencies]
iced_test = "0.14"
