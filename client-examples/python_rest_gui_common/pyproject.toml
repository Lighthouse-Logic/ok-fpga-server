[project]
name = "python-rest-gui-common"
version = "0.1.1"
description = "Shared REST API client for ok-FPGA-Server Python GUI demos"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
