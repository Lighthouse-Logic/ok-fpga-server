[project]
name = "python-grpc-gui-common"
version = "0.1.0"
description = "Shared gRPC API client for ok-FPGA-Server Python GUI demos"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
