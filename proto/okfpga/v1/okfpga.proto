// Copyright 2026 Great Bay Synergy LLC d/b/a Lighthouse Logic.
//
// ok-FPGA-Server gRPC Service Definition
// FrontPanel 6.1.0 API — USB 3.0, PCIe, Gen3 devices only
//
// This file defines the gRPC services and messages for remote FPGA
// management via the Opal Kelly FrontPanel 6.1.0 C API.

// Required: specifies the version of the .proto file format
syntax = "proto3";

// Namespace scoping for all items in this file
package okFPGAService.v1;

// Language-specific code generation directives
option java_multiple_files = true;
option java_outer_classname = "OkFPGAServiceProto";
option java_package = "io.grpc.okFPGAService";
option objc_class_prefix = "okFS";

// ============================================================================
// Common Types
// ============================================================================

// ErrorCluster follows the project's standard error reporting pattern.
// Every response includes one of these to indicate success or failure.
message ErrorCluster {
  // true if an error occurred, false if the operation succeeded.
  bool status = 1;
  // Numeric error code. Maps to ok_ErrorCode values from FrontPanel 6.1.0.
  // 0 = no error, negative values indicate specific failures.
  int32 code = 2;
  // Human-readable error source or description.
  string source = 3;
}

// Identifies a specific FPGA device by its 10-character serial number.
message DeviceRequest {
  // The serial number of the target FPGA (e.g., "ABC1234567").
  string serial = 1;
}

// Generic status response used by operations that don't return data.
message StatusResponse {
  // Error status for this operation.
  ErrorCluster error = 1;
}

// ============================================================================
// Enums
// ============================================================================

// The physical interface type connecting the FPGA to the host.
enum DeviceInterface {
  DEVICE_INTERFACE_UNKNOWN = 0;
  DEVICE_INTERFACE_USB2 = 1;    // Unsupported — devices with this are filtered out
  DEVICE_INTERFACE_PCIE = 2;
  DEVICE_INTERFACE_USB3 = 3;
  DEVICE_INTERFACE_GEN3 = 4;
}

// USB connection speed classification.
enum USBSpeed {
  USB_SPEED_UNKNOWN = 0;
  USB_SPEED_FULL = 1;
  USB_SPEED_HIGH = 2;
  USB_SPEED_SUPER = 3;
  USB_SPEED_SS_GEN1 = 4;
  USB_SPEED_SS_GEN2 = 5;
  USB_SPEED_SS_GEN2X2 = 6;
}

// FPGA silicon vendor.
enum FPGAVendor {
  FPGA_VENDOR_UNKNOWN = 0;
  FPGA_VENDOR_XILINX = 1;
  FPGA_VENDOR_INTEL = 2;
}

// Physical host interface (transport layer) for a device.
// This describes the USB host-side data transport, NOT which HDL endpoint
// families (Classic wires/triggers vs AXI register bridge) the bitfile implements.
// A bitfile can implement both Classic and AXI endpoints simultaneously.
// See ADR-003 Addendum A.
enum DataportType {
  DATAPORT_UNKNOWN = 0;
  DATAPORT_LEGACY = 1;   // FP-Gen1/Gen2 USB host interface
  DATAPORT_AXI = 2;      // FP-Gen3 USB host interface
}

// State of a user-defined resource exposed by a programmed FPGA.
enum ResourceState {
  RESOURCE_STATE_UNAVAILABLE = 0;
  RESOURCE_STATE_INITIALIZING = 1;
  RESOURCE_STATE_AVAILABLE = 2;
  RESOURCE_STATE_IN_USE_SHARED = 3;
  RESOURCE_STATE_IN_USE_LOCKED = 4;
}

// Type of a device sensor reading.
enum SensorType {
  SENSOR_TYPE_INVALID = 0;
  SENSOR_TYPE_BOOL = 1;
  SENSOR_TYPE_INTEGER = 2;
  SENSOR_TYPE_FLOAT = 3;
  SENSOR_TYPE_VOLTAGE = 4;
  SENSOR_TYPE_CURRENT = 5;
  SENSOR_TYPE_TEMPERATURE = 6;
  SENSOR_TYPE_FAN_RPM = 7;
  SENSOR_TYPE_POWER = 8;
}

// Holder access mode: the mode a user acquires a resource with.
enum AccessMode {
  ACCESS_MODE_SHARED = 0;
  ACCESS_MODE_EXCLUSIVE = 1;
  // Read-only mode (ADR-026, ADR-034 §8, D75): observe without writing.
  // ReadOnly holders may READ every item their resources cover unless the
  // item (or the resource) is private: WireOuts (incl. UpdateWireOuts),
  // TriggerOuts (IsTriggered, GetTriggerOutVector, UpdateTriggerOuts),
  // PipeOut / BTPipeOut, ReadRegister(s) and AXI reads. They may NEVER
  // write (SetWireInValue, UpdateWireIns, ActivateTriggerIn, PipeIn /
  // BTPipeIn, WriteRegister(s), AXI writes) and may not call ResetFPGA or
  // AXI resets.
  // UpdateTriggerOuts clears every TriggerOut latch on the device, so it is
  // denied to ReadOnly holders when any resource on the device declares a
  // private TriggerOut.
  // Design rule (recommended, not enforced): a ReadOnly action SHOULD NOT
  // change user-logic state or consume data other holders rely on
  // (TriggerOut latches, Pipe/BTPipe FIFOs, clear-on-read registers). Mark
  // any item whose read could have such a side-effect `private`.
  // ReadOnly holders can join even exclusive resources unless the resource
  // is private.
  ACCESS_MODE_READ_ONLY = 2;
}

// Declared access mode of a resource or of one declared item (ADR-034).
// Only shared and exclusive can be declared; read_only is a holder mode.
// Always used as an `optional` field, so "not set" is distinguishable from
// SHARED (there is deliberately no UNSPECIFIED value, D59).
enum ResourceAccessMode {
  RESOURCE_ACCESS_MODE_SHARED = 0;
  RESOURCE_ACCESS_MODE_EXCLUSIVE = 1;
}

// Why a resource was deleted (ADR-034, D58).
enum DeleteReason {
  // A client called DeleteResource (or REST DELETE /resources/{id}).
  DELETE_REASON_CLIENT = 0;
  // The FPGA was reprogrammed (forced cleanup).
  DELETE_REASON_REPROGRAM = 1;
  // The FPGA configuration was cleared (forced cleanup).
  DELETE_REASON_CLEAR = 2;
}

// ============================================================================
// Device Information Messages
// ============================================================================

// Complete device information for a connected FPGA.
// Maps to the okTDeviceInfo C struct from FrontPanel 6.1.0.
message DeviceInfo {
  string serial = 1;                    // 10-char serial number
  string device_id = 2;                 // User-settable device ID string
  string product_name = 3;              // e.g., "XEM8320-AU25P"
  int32 product_id = 4;                 // OK_PRODUCT_* constant
  DeviceInterface device_interface = 5;  // USB3, PCIe, or Gen3
  // USB connection speed.
  USBSpeed usb_speed = 6;
  // Device firmware major version.
  int32 device_major_version = 7;
  // Device firmware minor version.
  int32 device_minor_version = 8;
  // FrontPanel wire endpoint bit width.
  int32 wire_width = 9;
  // FrontPanel trigger endpoint bit width.
  int32 trigger_width = 10;
  // FrontPanel pipe endpoint bit width.
  int32 pipe_width = 11;
  // Register address width in bits.
  int32 register_address_width = 12;
  // Register data width in bits.
  int32 register_data_width = 13;
  // FPGA silicon vendor.
  FPGAVendor fpga_vendor = 14;
  // Data port type for this device.
  DataportType dataport = 15;
  // True if FrontPanel is enabled in the bitfile.
  bool is_front_panel_enabled = 16;
  // Present only if the FPGA has been programmed with a bitfile.
  optional BitfileInfo bitfile = 17;
}

// Information about the bitfile currently loaded on an FPGA.
message BitfileInfo {
  // Filename on disk.
  string filename = 1;
  // Human-readable description.
  string description = 2;
  string programmed_at = 3;   // ISO 8601 timestamp
  string programmed_by = 4;   // User ID who programmed it
  // Phase 34-C: Full path on the server filesystem (empty for client uploads).
  string file_path = 5;
  // Phase 34-C: MD5 hash of the bitfile content, hex-encoded.
  string md5_hash = 6;
}

// A single sensor reading from a device.
message DeviceSensor {
  // Numeric identifier.
  int32 id = 1;
  // Type of sensor reading.
  SensorType sensor_type = 2;
  // Human-readable name.
  string name = 3;
  // Human-readable description.
  string description = 4;
  // Minimum sensor value.
  double min = 5;
  // Maximum sensor value.
  double max = 6;
  // Sensor value step/resolution.
  double step = 7;
  // Current sensor reading.
  double value = 8;
}

// A single device setting key-value pair.
message DeviceSetting {
  // Setting key name.
  string key = 1;
  // The value is either a string or an integer — use oneof.
  oneof value {
    string string_value = 2;   // String value variant.
    uint32 int_value = 3;      // Integer value variant.
  }
}

// A SYZYGY peripheral port discovered on the device.
message SyzygyPort {
  uint32 index = 1;               // 0-based port index
  uint32 port_status_mv = 2;      // SmartVIO voltage in millivolts (0 = unpowered)
  bool is_populated = 3;          // true if a peripheral is detected
  // SYZYGY peripheral manufacturer.
  string manufacturer_name = 4;
  // Product name.
  string product_name = 5;
  // Product model identifier.
  string product_model = 6;
  // Product version string.
  string product_version = 7;
  // Device serial number.
  string serial_number = 8;
}

// ============================================================================
// Resource Management Messages
// ============================================================================

// A user-defined resource exposed by a programmed FPGA (ADR-034).
message Resource {
  // Old `repeated string holders`; replaced by `holders = 9` (with mode).
  // Only the number is reserved: the name lives on in field 9.
  reserved 6;

  // Unique resource identifier: "{device_serial}:{name}".
  string id = 1;
  // Human-readable name.
  string name = 2;
  // Human-readable description.
  string description = 3;
  string device_serial = 4;      // Serial of the FPGA providing this resource
  // Current resource state.
  ResourceState state = 5;
  // Access rule, not visibility (ADR-034 P13, D57): when true, ReadOnly
  // acquisition is denied. Every user can still list the resource.
  bool private = 7;
  // Phase 34-A: User ID of the lock holder (empty string if not locked).
  // Populated when state == RESOURCE_STATE_IN_USE_LOCKED.
  string locked_by = 8;
  // Current holders and the mode each acquired with (D37).
  repeated Holder holders = 9;
  // Declared mode of the resource.
  optional ResourceAccessMode access_mode = 10;
  // Data-port interfaces: "classic", "axi_lite", "axi_full", "axi_stream".
  repeated string interfaces = 11;
  // Classic endpoint declaration. Not set = the resource claims every
  // classic endpoint exclusively (D68).
  EndpointDeclaration endpoints = 12;
  // Declared 32-bit address ranges.
  repeated AddressRange address_ranges = 13;
  // Text-only metadata (D69).
  map<string, string> metadata = 14;
}

// One holder of a resource.
message Holder {
  // The holder's user ID.
  string user_id = 1;
  // The mode the user acquired with.
  AccessMode mode = 2;
}

// Classic endpoint declaration of a resource.
message EndpointDeclaration {
  // Mode for entries without their own `access` (D61). Used only at
  // registration; it never claims endpoints that are not listed.
  optional ResourceAccessMode default_access = 1;
  // Declared endpoints.
  repeated EndpointEntry entries = 2;
}

// One declared Classic endpoint.
message EndpointEntry {
  // Endpoint address, 0x00-0xBF.
  uint32 address = 1;
  // "wire_in", "wire_out", "trigger_in", "trigger_out", "pipe_in",
  // "pipe_out", "bt_pipe_in" or "bt_pipe_out"; must match the address.
  string type = 2;
  // Declared mode; falls back to EndpointDeclaration.default_access.
  optional ResourceAccessMode access = 3;
  // Item-level private flag (access rule, not visibility): ReadOnly holders
  // cannot read this item. Set it on any item whose read could change
  // user-logic state or consume data other holders rely on (TriggerOut,
  // PipeOut / BTPipeOut, clear-on-read registers) (D75).
  bool private = 4;
  // Optional description.
  string description = 5;
}

// One declared 32-bit address range (inclusive).
message AddressRange {
  // Optional range name.
  string name = 1;
  // First address.
  uint32 start = 2;
  // Last address (inclusive); must be >= start.
  uint32 end = 3;
  // Declared mode (required).
  optional ResourceAccessMode access = 4;
  // Item-level private flag (access rule, not visibility): ReadOnly holders
  // cannot read this item. Set it on any item whose read could change
  // user-logic state or consume data other holders rely on (TriggerOut,
  // PipeOut / BTPipeOut, clear-on-read registers) (D75).
  bool private = 5;
  // Optional description.
  string description = 6;
}

// One resource held by a user (ADR-034 P5).
message Holding {
  // The held resource.
  string resource_id = 1;
  // The mode the user acquired with.
  AccessMode mode = 2;
  // True if this user holds the resource's lock.
  bool locked = 3;
}

// A connected user and their held resources.
message UserSession {
  // User identifier.
  string user_id = 1;
  string connected_at = 2;       // ISO 8601 timestamp
  // IDs of resources held by this user.
  repeated string held_resource_ids = 3;
  // Held resources with mode and lock flag (ADR-034 P5).
  repeated Holding holdings = 4;
}

// Machine-readable detail of a failed resource operation (ADR-034, D73).
//
// Sent in the standard `google.rpc.Status` error details (trailer
// `grpc-status-details-bin`), packed as
// `type.googleapis.com/okFPGAService.v1.ResourceConflictDetail`.
// Same fields as the REST `ProblemDetail.conflict` object.
message ResourceConflictDetail {
  // "overlap", "locked", "blocked", "mode_mismatch" or "validation".
  string code = 1;
  // Existing resource involved (empty if none).
  string resource_id = 2;
  // Name of that resource (empty if none).
  string resource_name = 3;
  // "endpoint" or "address_range" (empty if none).
  string item_type = 4;
  // The item: "0x05" or "0x44A60000-0x44A6FFFF" (empty if none).
  string item = 5;
}

// ============================================================================
// Server Messages
// ============================================================================

// Server status information.
message ServerStatus {
  string version = 1;            // Server version (e.g., "0.1.0")
  string frontpanel_version = 2; // FrontPanel API version (e.g., "6.1.0")
  string platform = 3;           // e.g., "windows-x86_64" or "linux-x86_64"
  string uptime = 4;             // Human-readable uptime
  // Server uptime in seconds.
  int64 uptime_seconds = 5;
  // Number of connected FPGA devices.
  int32 connected_devices = 6;
  // Number of active resources.
  int32 active_resources = 7;
}

// ============================================================================
// Event Streaming Messages
// ============================================================================

// A real-time event pushed to clients via server streaming.
message DeviceEvent {
  string timestamp = 1;          // ISO 8601 timestamp
  oneof event {
    DeviceAdded device_added = 2;                           // Device connected.
    DeviceRemoved device_removed = 3;                       // Device disconnected.
    BitfileProgrammed bitfile_programmed = 4;               // FPGA programmed.
    ResourceStateChanged resource_state_changed = 5;        // Resource state changed.
    // ADR-034 (P6): parity with the REST SSE events.
    ResourceCreatedEvent resource_created = 6;              // Resource registered.
    ResourceDeletedEvent resource_deleted = 7;              // Resource deleted.
    ResourceLockedEvent resource_locked = 8;                // Shared resource locked.
    ResourceUnlockedEvent resource_unlocked = 9;            // Shared resource unlocked.
    UserConnectedEvent user_connected = 10;                 // User session created.
    UserDisconnectedEvent user_disconnected = 11;           // User session ended.
    ServerShutdownEvent server_shutdown = 12;               // Server shutting down.
  }
}

message ResourceCreatedEvent {
  // New resource ID.
  string resource_id = 1;
  // Device providing the resource.
  string device_serial = 2;
  // Resource name.
  string name = 3;
}

message ResourceDeletedEvent {
  // Deleted resource ID.
  string resource_id = 1;
  // Why it was deleted (D58).
  DeleteReason reason = 2;
}

message ResourceLockedEvent {
  // Locked resource ID.
  string resource_id = 1;
  // User who took the lock.
  string user_id = 2;
}

message ResourceUnlockedEvent {
  // Unlocked resource ID.
  string resource_id = 1;
  // User who released the lock.
  string user_id = 2;
}

message UserConnectedEvent {
  // User who connected.
  string user_id = 1;
}

message UserDisconnectedEvent {
  // User who disconnected.
  string user_id = 1;
  // "explicit" or "timeout".
  string reason = 2;
}

message ServerShutdownEvent {
  // Why the server is stopping (e.g. "signal").
  string reason = 1;
}

message DeviceAdded {
  // Device serial number.
  string serial = 1;
  // Product name.
  string product_name = 2;
  // Physical interface type.
  DeviceInterface device_interface = 3;
}

message DeviceRemoved {
  // Device serial number.
  string serial = 1;
}

message BitfileProgrammed {
  // Device serial number.
  string serial = 1;
  // Filename on disk.
  string filename = 2;
  // User who programmed the bitfile.
  string programmed_by = 3;
}

message ResourceStateChanged {
  // Resource identifier.
  string resource_id = 1;
  // State before the change.
  ResourceState previous_state = 2;
  // State after the change.
  ResourceState new_state = 3;
  // Serial of the FPGA device.
  string device_serial = 4;
}

// ============================================================================
// Request/Response Messages — Device Service
// ============================================================================

message ListDevicesRequest {}

message ListDevicesResponse {
  // List of device info records.
  repeated DeviceInfo devices = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message DeviceInfoResponse {
  // Device information record.
  DeviceInfo device = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message DeviceSensorsResponse {
  // List of sensor readings.
  repeated DeviceSensor sensors = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message DeviceSettingsResponse {
  // List of device settings.
  repeated DeviceSetting settings = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message GetDeviceSettingRequest {
  // Device serial number.
  string serial = 1;
  // Setting key name.
  string key = 2;
}

message DeviceSettingResponse {
  // Device setting key-value pair.
  DeviceSetting setting = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message SetDeviceSettingRequest {
  // Device serial number.
  string serial = 1;
  // Device setting key-value pair.
  DeviceSetting setting = 2;
}

message SyzygyPortsResponse {
  // List of SYZYGY ports.
  repeated SyzygyPort ports = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

// Configure FPGA from a file path on the server's filesystem.
message ConfigureFPGARequest {
  // Device serial number.
  string serial = 1;
  // Path to the bitfile on the server filesystem.
  string bitfile_path = 2;
  // User identifier.
  string user_id = 3;
}

// Configure FPGA from memory — client sends the bitfile in chunks.
message ConfigureFPGAChunk {
  string serial = 1;       // Only required in the first chunk
  bytes data = 2;           // Chunk of the bitfile binary
  bool is_last = 3;         // true for the final chunk
  string user_id = 4;       // Only required in the first chunk
  // Phase 34-C: Original filename of the bitfile (only in the first chunk, optional).
  // If empty, the server falls back to "uploaded".
  string filename = 5;
}

message ConfigureFPGAResponse {
  // Bitfile programming record.
  BitfileInfo bitfile = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message BitfileInfoResponse {
  // Bitfile programming record.
  BitfileInfo bitfile = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message DataportTypeResponse {
  // Data port type for this device.
  DataportType dataport = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

// Set the user-definable device ID string (max 32 chars).
message SetDeviceIDRequest {
  // Device serial number.
  string serial = 1;
  // User-settable device ID string.
  string device_id = 2;
}

// Set the communication timeout in milliseconds.
message SetTimeoutRequest {
  // Device serial number.
  string serial = 1;
  // Communication timeout in milliseconds.
  int32 timeout_ms = 2;
}

// PLL configuration is opaque — the server manages it internally.
message GetPLLRequest {
  // Device serial number.
  string serial = 1;
  int32 pll_index = 2;    // 0 = PLL22150, 1 = PLL22393
}

message PLLConfigurationResponse {
  // PLL reference clock frequency in Hz.
  double reference_frequency = 1;
  // PLL output channel configurations.
  repeated PLLOutput outputs = 2;
  // Error status for this operation.
  ErrorCluster error = 3;
}

message PLLOutput {
  // Zero-based index.
  int32 index = 1;
  // Frequency in Hz.
  double frequency = 2;
  // Whether this item is enabled.
  bool enabled = 3;
}

message SetPLLRequest {
  // Device serial number.
  string serial = 1;
  // PLL index (0 = PLL22150, 1 = PLL22393).
  int32 pll_index = 2;
  // PLL reference clock frequency in Hz.
  double reference_frequency = 3;
  // PLL output channel configurations.
  repeated PLLOutput outputs = 4;
}

// Flash memory operations.
message FlashReadRequest {
  // Device serial number.
  string serial = 1;
  // Memory/register address.
  uint32 address = 2;
  // Number of bytes to read.
  uint32 length = 3;
}

message FlashDataResponse {
  // Raw binary data payload.
  bytes data = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message FlashWriteRequest {
  // Device serial number.
  string serial = 1;
  // Memory/register address.
  uint32 address = 2;
  // Raw binary data payload.
  bytes data = 3;
}

message FlashEraseSectorRequest {
  // Device serial number.
  string serial = 1;
  // Memory/register address.
  uint32 address = 2;
}

message WatchDeviceEventsRequest {
  // Empty — subscribes to all events. Future: add filters here.
}

message ServerStatusRequest {}

// ============================================================================
// Request/Response Messages — Classic Data Port
// ============================================================================

// Set one or more WireIn values and optionally update.
message SetWireInValueRequest {
  // Device serial number.
  string serial = 1;
  int32 endpoint = 2;        // Endpoint address (0x00-0x1F)
  // Read/write value.
  uint32 value = 3;
  uint32 mask = 4;            // Bitmask — only bits set in mask are modified
  bool auto_update = 5;       // If true, call UpdateWireIns after setting
}

message GetWireValueRequest {
  // Device serial number.
  string serial = 1;
  int32 endpoint = 2;        // Endpoint address
  // GetWireOutValue only (ignored by GetWireInValue): when true, the server
  // calls UpdateWireOuts immediately before the read, under the same device
  // lock. Not set / false = read the current snapshot, exactly like Opal
  // Kelly's GetWireOutValue (ADR-034 §9, D76).
  optional bool update = 3;
}

message WireValueResponse {
  // Read/write value.
  uint32 value = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message ActivateTriggerInRequest {
  // Device serial number.
  string serial = 1;
  int32 endpoint = 2;        // Endpoint address (0x40-0x5F)
  int32 bit = 3;              // Bit index to trigger (0-31)
}

message IsTriggeredRequest {
  // Device serial number.
  string serial = 1;
  int32 endpoint = 2;        // Endpoint address (0x60-0x7F)
  // Bits to test (Opal Kelly IsTriggered mask). Not set = 0 (D78), so
  // `triggered` is false until the caller names the bits it cares about.
  // Deliberately not all-ones: that would make a client look correct while
  // also reporting triggers on unrelated bits. Use GetTriggerOutVector for
  // the full vector.
  uint32 mask = 3;
  // When true, the server calls UpdateTriggerOuts immediately before the
  // read, under the same device lock (ADR-034 §9, D76). Not set / false =
  // read the current snapshot, exactly like Opal Kelly's IsTriggered.
  // UpdateTriggerOuts clears the latches of EVERY TriggerOut on the device
  // for every client; see the UpdateTriggerOuts RPC comment.
  optional bool update = 4;
}

message IsTriggeredResponse {
  // True if the trigger condition was met.
  bool triggered = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message TriggerOutVectorRequest {
  // Device serial number.
  string serial = 1;
  // FrontPanel endpoint address.
  int32 endpoint = 2;
  // Same meaning as IsTriggeredRequest.update (ADR-034 §9, D76).
  optional bool update = 3;
}

message TriggerOutVectorResponse {
  // Full trigger bit vector.
  uint32 vector = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

// Write data to a PipeIn endpoint.
message WriteToPipeInRequest {
  // Device serial number.
  string serial = 1;
  int32 endpoint = 2;        // Endpoint address (0x80-0x9F)
  // Raw binary data payload.
  bytes data = 3;
}

// Read data from a PipeOut endpoint.
message ReadFromPipeOutRequest {
  // Device serial number.
  string serial = 1;
  int32 endpoint = 2;        // Endpoint address (0xA0-0xBF)
  int64 length = 3;          // Number of bytes to read
}

message PipeTransferResponse {
  // Number of bytes actually transferred.
  int64 bytes_transferred = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message PipeDataResponse {
  // Raw binary data payload.
  bytes data = 1;
  // Number of bytes actually transferred.
  int64 bytes_transferred = 2;
  // Error status for this operation.
  ErrorCluster error = 3;
}

// Block pipe transfers — more efficient for large data.
message WriteToBlockPipeInRequest {
  // Device serial number.
  string serial = 1;
  // FrontPanel endpoint address.
  int32 endpoint = 2;
  // Block size in bytes for block-throttled transfers.
  int32 block_size = 3;
  // Raw binary data payload.
  bytes data = 4;
}

message ReadFromBlockPipeOutRequest {
  // Device serial number.
  string serial = 1;
  // FrontPanel endpoint address.
  int32 endpoint = 2;
  // Block size in bytes for block-throttled transfers.
  int32 block_size = 3;
  // Number of bytes to read.
  int64 length = 4;
}

// Set the polling interval for block-throttled pipe transfers.
message SetBTPipePollingIntervalRequest {
  // Device serial number.
  string serial = 1;
  // Polling interval in milliseconds.
  int32 interval = 2;
}

// A single register address-data pair (maps to okTRegisterEntry).
message RegisterEntry {
  // Memory/register address.
  uint32 address = 1;
  // Data value.
  uint32 data = 2;
}

message ReadRegisterRequest {
  // Device serial number.
  string serial = 1;
  // Memory/register address.
  uint32 address = 2;
}

message RegisterValueResponse {
  // Read/write value.
  uint32 value = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message WriteRegisterRequest {
  // Device serial number.
  string serial = 1;
  // Memory/register address.
  uint32 address = 2;
  // Data value.
  uint32 data = 3;
}

// Bulk register read — reads multiple registers in one call.
message ReadRegistersRequest {
  // Device serial number.
  string serial = 1;
  // Memory/register address.
  repeated uint32 addresses = 2;
}

message RegisterEntriesResponse {
  // Array of register address-data pairs.
  repeated RegisterEntry entries = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

// Bulk register write — writes multiple registers in one call.
message WriteRegistersRequest {
  // Device serial number.
  string serial = 1;
  // Array of register address-data pairs.
  repeated RegisterEntry entries = 2;
}

// ============================================================================
// Request/Response Messages — AXI Data Port
// ============================================================================

// --- AXI Lite ---

message AXILiteReadRequest {
  // Device serial number.
  string serial = 1;
  // AXI address.
  uint64 address = 2;
  optional uint32 timeout_ms = 3;  // If absent, uses device default timeout
}

message AXILiteReadResponse {
  // Read/write value.
  uint32 value = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message AXILiteWriteRequest {
  // Device serial number.
  string serial = 1;
  // AXI address.
  uint64 address = 2;
  // Read/write value.
  uint32 value = 3;
  // Communication timeout in milliseconds.
  optional uint32 timeout_ms = 4;
}

message AXILiteReadBulkRequest {
  // Device serial number.
  string serial = 1;
  // AXI address.
  uint64 address = 2;
  uint64 count = 3;               // Number of 32-bit words to read
  // Communication timeout in milliseconds.
  optional uint32 timeout_ms = 4;
}

message AXILiteReadBulkResponse {
  // Read/write value.
  repeated uint32 values = 1;
  // Number of bytes actually transferred.
  uint64 bytes_transferred = 2;
  // Error status for this operation.
  ErrorCluster error = 3;
}

message AXILiteWriteBulkRequest {
  // Device serial number.
  string serial = 1;
  // AXI address.
  uint64 address = 2;
  // Read/write value.
  repeated uint32 values = 3;
  // Communication timeout in milliseconds.
  optional uint32 timeout_ms = 4;
}

// Operation statistics returned by bulk AXI operations.
message AXIOperationStats {
  // Total bytes transferred in this operation.
  uint64 transfer_byte_count = 1;
  // Number of AXI transactions performed.
  uint64 transaction_count = 2;
  // Error status for this operation.
  ErrorCluster error = 3;
}

// --- AXI Full ---

message DatapathWidthResponse {
  // Datapath width in bytes.
  uint32 width_bytes = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message AXIFullReadRequest {
  // Device serial number.
  string serial = 1;
  // AXI address.
  uint64 address = 2;
  uint64 length = 3;             // Number of bytes to read
  optional uint32 burst = 4;     // Burst length (if absent, uses default)
  // Communication timeout in milliseconds.
  optional uint32 timeout_ms = 5;
}

message AXIFullReadResponse {
  // Raw binary data payload.
  bytes data = 1;
  // Number of bytes actually transferred.
  uint64 bytes_transferred = 2;
  // Error status for this operation.
  ErrorCluster error = 3;
}

message AXIFullWriteRequest {
  // Device serial number.
  string serial = 1;
  // AXI address.
  uint64 address = 2;
  // Raw binary data payload.
  bytes data = 3;
  // Optional AXI burst length.
  optional uint32 burst = 4;
  // Communication timeout in milliseconds.
  optional uint32 timeout_ms = 5;
}

// --- AXI Stream ---

message AXIStreamDatapathWidthsResponse {
  // Write datapath width in bytes.
  uint32 write_width_bytes = 1;
  // Read datapath width in bytes.
  uint32 read_width_bytes = 2;
  // Error status for this operation.
  ErrorCluster error = 3;
}

message AXIStreamReadRequest {
  // Device serial number.
  string serial = 1;
  uint64 length = 2;            // Number of bytes to read
  // Communication timeout in milliseconds.
  optional uint32 timeout_ms = 3;
}

message AXIStreamReadResponse {
  // Raw binary data payload.
  bytes data = 1;
  // Number of bytes actually transferred.
  uint64 bytes_transferred = 2;
  // Error status for this operation.
  ErrorCluster error = 3;
}

message AXIStreamWriteRequest {
  // Device serial number.
  string serial = 1;
  // Raw binary data payload.
  bytes data = 2;
  // Communication timeout in milliseconds.
  optional uint32 timeout_ms = 3;
}

message AXIStreamWriteResponse {
  // Number of bytes actually transferred.
  uint64 bytes_transferred = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

// ============================================================================
// Request/Response Messages — Resource Management
// ============================================================================

message ListResourcesRequest {}

message ListResourcesResponse {
  // List of resources.
  repeated Resource resources = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message ResourceRequest {
  // Resource identifier.
  string resource_id = 1;
}

message ResourceResponse {
  // Resource details.
  Resource resource = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message AcquireResourceRequest {
  // Resource identifier.
  string resource_id = 1;
  // User identifier.
  string user_id = 2;
  // Requested holder mode (shared, exclusive, or read_only — ADR-026).
  // Optional (ADR-034 P3): when not set, the resource's declared mode is
  // used.
  optional AccessMode mode = 3;
}

message ReleaseResourceRequest {
  // Resource identifier.
  string resource_id = 1;
  // User identifier.
  string user_id = 2;
}

// Request to create a new resource for a programmed FPGA.
// The client creates resources after programming a bitfile, since the client
// knows what capabilities the bitfile exposes. See ADR-016 and ADR-034.
// Same fields and rules as the REST `CreateResourceRequest`.
message CreateResourceRequest {
  // Human-readable resource name (e.g., "xem7320-classic-counters").
  string name = 1;
  // Optional description of the resource.
  string description = 2;
  // Serial of the FPGA that provides this resource.
  string device_serial = 3;
  // Declared mode. Required when `endpoints` is set (D62). When
  // `endpoints` is not set it may be omitted (= exclusive) or exclusive;
  // shared is rejected (D68). Replaces the old `string resource_type`.
  optional ResourceAccessMode access_mode = 4;
  // Interfaces used: "classic", "axi_lite", "axi_full", "axi_stream"; at
  // least one (D65, D71). Replaces the old `capabilities` list.
  repeated string interfaces = 5;
  // Classic endpoint declaration. Not set = an exclusive resource that
  // claims every Wire and Trigger endpoint (0x00-0x7F) (D68, revised by
  // D77). It claims NO Pipe / BTPipe endpoints: the server cannot tell a
  // Pipe from a BTPipe at the same address, so those must be declared
  // explicitly. While such a resource exists no other classic resource can
  // register on the device (D23). Set but empty = no classic endpoints.
  EndpointDeclaration endpoints = 6;
  // Declared 32-bit address ranges.
  repeated AddressRange address_ranges = 7;
  // Text-only metadata (D69).
  map<string, string> metadata = 8;
  // Resource-level private flag (access rule, not visibility): when true,
  // ReadOnly acquisition is denied (D57, D75).
  bool private = 9;
}

// ============================================================================
// Request/Response Messages — Users
// ============================================================================

message ListUsersRequest {}

message ListUsersResponse {
  // List of user sessions.
  repeated UserSession users = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

message UserRequest {
  // User identifier.
  string user_id = 1;
}

message UserResponse {
  // User session details.
  UserSession user = 1;
  // Error status for this operation.
  ErrorCluster error = 2;
}

// Heartbeat / liveness ping (ADR-020 §5).
// Clients should send this periodically to keep their session alive.
message PingRequest {
  // User identifier sending the heartbeat.
  string user_id = 1;
}

message PingResponse {
  // Server timestamp (ISO 8601) when the ping was received.
  string server_time = 1;
  ErrorCluster error = 2;
}

// User-initiated disconnect request (Phase 25-Fix-H, F10).
// Releases all resources held by this user and removes the session.
message DisconnectRequest {
  // User identifier to disconnect.
  string user_id = 1;
}

// Response to a disconnect request.
message DisconnectResponse {
  // The user that was disconnected.
  string user_id = 1;
  // Number of resources that were released during disconnect.
  int32 released_resources = 2;
  // Human-readable status message.
  string message = 3;
}

// Lock/unlock a shared resource (ADR-020 §3).
message LockResourceRequest {
  // Resource identifier.
  string resource_id = 1;
  // User requesting the lock.
  string user_id = 2;
}

// ============================================================================
// Service Definitions
// ============================================================================

// DeviceService handles device discovery, configuration, and monitoring.
// It corresponds to the FrontPanel device-level operations (not data port ops).
//
// Caller identity (ADR-029, ADR-034 P8): every resource RPC requires the
// `x-user-id` metadata header (or the request's `user_id` field where one
// exists).
//
// Status mapping for resource RPCs (ADR-034 P7), matching REST:
//   REST 404 -> NOT_FOUND            (unknown resource / device)
//   REST 409 -> FAILED_PRECONDITION  (overlap, locked, blocked,
//                                     mode_mismatch, duplicate name,
//                                     device not programmed, held on delete)
//   REST 422 -> INVALID_ARGUMENT     (invalid declaration or mode)
// When a D73 code applies, the error details carry a
// ResourceConflictDetail (see that message).
service DeviceService {
  // --- Enumeration ---

  // List all currently connected and supported FPGA devices.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // Get detailed information for a specific device by serial number.
  rpc GetDeviceInfo(DeviceRequest) returns (DeviceInfoResponse);

  // --- Sensors & Settings ---

  // Read all sensor values (voltage, temperature, current, etc.) from a device.
  rpc GetDeviceSensors(DeviceRequest) returns (DeviceSensorsResponse);

  // List all device settings as key-value pairs.
  rpc GetDeviceSettings(DeviceRequest) returns (DeviceSettingsResponse);

  // Read a single device setting by key.
  rpc GetDeviceSetting(GetDeviceSettingRequest) returns (DeviceSettingResponse);

  // Write a single device setting by key.
  rpc SetDeviceSetting(SetDeviceSettingRequest) returns (StatusResponse);

  // --- SYZYGY ---

  // Discover all SYZYGY peripheral ports and their connected peripherals.
  rpc GetSyzygyPorts(DeviceRequest) returns (SyzygyPortsResponse);

  // --- FPGA Configuration ---

  // Program the FPGA with a bitfile from the server's filesystem.
  rpc ConfigureFPGA(ConfigureFPGARequest) returns (ConfigureFPGAResponse);

  // Program the FPGA with a bitfile streamed from the client in chunks.
  rpc ConfigureFPGAFromMemory(stream ConfigureFPGAChunk) returns (ConfigureFPGAResponse);

  // Clear the current FPGA configuration (un-program the FPGA).
  rpc ClearFPGAConfiguration(DeviceRequest) returns (StatusResponse);

  // Get information about the currently loaded bitfile (if any).
  rpc GetBitfileInfo(DeviceRequest) returns (BitfileInfoResponse);

  // Get the data port type (classic, AXI, or none if not configured).
  rpc GetDataportType(DeviceRequest) returns (DataportTypeResponse);

  // --- PLL Configuration ---

  // Read the current PLL configuration.
  rpc GetPLLConfiguration(GetPLLRequest) returns (PLLConfigurationResponse);

  // Write a new PLL configuration.
  rpc SetPLLConfiguration(SetPLLRequest) returns (StatusResponse);

  // Reset the PLL to its default (EEPROM) configuration.
  rpc LoadDefaultPLLConfiguration(DeviceRequest) returns (StatusResponse);

  // --- Flash Memory ---

  // Read data from on-board flash memory.
  rpc FlashRead(FlashReadRequest) returns (FlashDataResponse);

  // Write data to on-board flash memory.
  rpc FlashWrite(FlashWriteRequest) returns (StatusResponse);

  // Erase a flash memory sector.
  rpc FlashEraseSector(FlashEraseSectorRequest) returns (StatusResponse);

  // --- Device Management ---

  // Set the user-definable device ID string.
  rpc SetDeviceID(SetDeviceIDRequest) returns (StatusResponse);

  // Set the communication timeout in milliseconds.
  rpc SetTimeout(SetTimeoutRequest) returns (StatusResponse);

  // --- Server ---

  // Get server status (version, uptime, connected device count).
  rpc GetServerStatus(ServerStatusRequest) returns (ServerStatus);

  // --- Events (server streaming) ---

  // Subscribe to real-time device and resource events.
  // The server pushes DeviceEvent messages as they occur.
  rpc WatchDeviceEvents(WatchDeviceEventsRequest) returns (stream DeviceEvent);

  // --- Resource Management ---

  // List all resources across all programmed FPGAs.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);

  // Get details for a specific resource.
  rpc GetResource(ResourceRequest) returns (ResourceResponse);

  // Create a new resource for a programmed FPGA.
  // The client creates resources after programming a bitfile. See ADR-016.
  rpc CreateResource(CreateResourceRequest) returns (ResourceResponse);

  // Delete a resource definition.
  // Returns an error if the resource is currently held by any user.
  rpc DeleteResource(ResourceRequest) returns (StatusResponse);

  // Acquire a resource in shared, exclusive, or read-only mode (ADR-026).
  rpc AcquireResource(AcquireResourceRequest) returns (ResourceResponse);

  // Release a previously acquired resource.
  rpc ReleaseResource(ReleaseResourceRequest) returns (StatusResponse);

  // Lock a shared resource for exclusive use by a holder (ADR-020 §3).
  // Returns the updated resource (ADR-034 P10).
  rpc LockResource(LockResourceRequest) returns (ResourceResponse);

  // Unlock a previously locked shared resource (ADR-020 §3).
  // Returns the updated resource (ADR-034 P10).
  rpc UnlockResource(LockResourceRequest) returns (ResourceResponse);

  // --- Users ---

  // List all connected users and their held resources.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Get details for a specific user.
  rpc GetUser(UserRequest) returns (UserResponse);

  // --- Heartbeat ---

  // Heartbeat / liveness ping (ADR-020 §5).
  // Clients should call this periodically to keep their session alive.
  rpc Ping(PingRequest) returns (PingResponse);

  // User-initiated disconnect (Phase 25-Fix-H, F10).
  // Releases all resources held by this user on any device,
  // removes the user session, and ceases heartbeat checking.
  // This is the recommended way to end a client session.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
}

// ClassicDataPortService handles FrontPanel Classic wire, trigger, pipe,
// and register operations using discrete okWireIn/okTriggerIn/etc. HDL modules.
// These endpoints are available when the loaded bitfile instantiates Classic
// endpoint modules on the okHost bus. The server does NOT gate access based
// on okTDeviceInfo.dataport (which describes the physical USB transport).
service ClassicDataPortService {
  // Reset the FPGA (equivalent to pressing the reset button). Changes
  // user-logic state, so it counts as a write: the caller must hold a
  // resource on the device in a mode other than ReadOnly (D66, D75).
  rpc ResetFPGA(DeviceRequest) returns (StatusResponse);

  // --- Wires ---

  // Set a WireIn endpoint value with optional bitmask.
  rpc SetWireInValue(SetWireInValueRequest) returns (StatusResponse);

  // Get the current value of a WireIn endpoint (from local cache).
  rpc GetWireInValue(GetWireValueRequest) returns (WireValueResponse);

  // Transfer all pending WireIn values to the FPGA.
  rpc UpdateWireIns(DeviceRequest) returns (StatusResponse);

  // Get the value of a WireOut endpoint from the snapshot taken by the last
  // UpdateWireOuts (by any client; one snapshot per device). Set
  // `update = true` to refresh the snapshot first under the same device
  // lock (ADR-034 §9, D76).
  rpc GetWireOutValue(GetWireValueRequest) returns (WireValueResponse);

  // Read all WireOut values from the FPGA into the device snapshot.
  // Allowed for ReadOnly holders: it only samples the WireOut inputs and is
  // invisible to user logic (D75).
  rpc UpdateWireOuts(DeviceRequest) returns (StatusResponse);

  // --- Triggers ---

  // Fire a single trigger bit on a TriggerIn endpoint.
  rpc ActivateTriggerIn(ActivateTriggerInRequest) returns (StatusResponse);

  // Read every TriggerOut latch from the FPGA into the device snapshot
  // (Opal Kelly: "determine if any TriggerOuts have been activated since the
  // last call"). This clears the latches of EVERY TriggerOut on the device,
  // so a trigger another client has not read yet is lost to it. Coordinate
  // trigger reads between clients (lock, exclusive resource) or mark
  // TriggerOuts private. Denied to ReadOnly holders when any resource on
  // the device declares a private TriggerOut (D75). A future server-side
  // TriggerOut event log may improve this (roadmap, Later).
  rpc UpdateTriggerOuts(DeviceRequest) returns (StatusResponse);

  // Check trigger bits on one TriggerOut endpoint in the snapshot taken by
  // the last UpdateTriggerOuts (by any client). Set `update = true` to
  // refresh first (ADR-034 §9, D76). A client cannot tell from this call
  // how many updates happened since its own previous read.
  rpc IsTriggered(IsTriggeredRequest) returns (IsTriggeredResponse);

  // Get the full trigger vector of one TriggerOut endpoint from the
  // snapshot (same snapshot rules as IsTriggered).
  rpc GetTriggerOutVector(TriggerOutVectorRequest) returns (TriggerOutVectorResponse);

  // --- Pipes ---

  // Write data to a PipeIn endpoint.
  rpc WriteToPipeIn(WriteToPipeInRequest) returns (PipeTransferResponse);

  // Read data from a PipeOut endpoint.
  rpc ReadFromPipeOut(ReadFromPipeOutRequest) returns (PipeDataResponse);

  // Write data to a BlockPipeIn endpoint (more efficient for large transfers).
  rpc WriteToBlockPipeIn(WriteToBlockPipeInRequest) returns (PipeTransferResponse);

  // Read data from a BlockPipeOut endpoint (more efficient for large transfers).
  rpc ReadFromBlockPipeOut(ReadFromBlockPipeOutRequest) returns (PipeDataResponse);

  // Set the polling interval for block-throttled pipe transfers.
  rpc SetBTPipePollingInterval(SetBTPipePollingIntervalRequest) returns (StatusResponse);

  // --- Registers ---

  // Read a single register by address.
  rpc ReadRegister(ReadRegisterRequest) returns (RegisterValueResponse);

  // Write a single register by address.
  rpc WriteRegister(WriteRegisterRequest) returns (StatusResponse);

  // Read multiple registers in a single call (bulk read).
  rpc ReadRegisters(ReadRegistersRequest) returns (RegisterEntriesResponse);

  // Write multiple registers in a single call (bulk write).
  rpc WriteRegisters(WriteRegistersRequest) returns (StatusResponse);
}

// AXIDataPortService handles FrontPanel AXI Lite, Full, and Stream
// operations via okRegisterBridge. These endpoints are available when the
// loaded bitfile instantiates okRegisterBridge on the okHost bus. The server
// does NOT gate access based on okTDeviceInfo.dataport.
service AXIDataPortService {
  // --- AXI Lite ---

  // Read a single 32-bit value from an AXI Lite address.
  rpc AXILiteRead(AXILiteReadRequest) returns (AXILiteReadResponse);

  // Write a single 32-bit value to an AXI Lite address.
  rpc AXILiteWrite(AXILiteWriteRequest) returns (StatusResponse);

  // Read multiple consecutive 32-bit values from AXI Lite (bulk read).
  rpc AXILiteReadBulk(AXILiteReadBulkRequest) returns (AXILiteReadBulkResponse);

  // Write multiple consecutive 32-bit values to AXI Lite (bulk write).
  rpc AXILiteWriteBulk(AXILiteWriteBulkRequest) returns (AXIOperationStats);

  // Reset the AXI Lite interface.
  rpc AXILiteReset(DeviceRequest) returns (StatusResponse);

  // --- AXI Full ---

  // Get the AXI Full datapath width in bytes.
  rpc AXIFullGetDatapathWidth(DeviceRequest) returns (DatapathWidthResponse);

  // Read bulk data from an AXI Full address.
  rpc AXIFullRead(AXIFullReadRequest) returns (AXIFullReadResponse);

  // Write bulk data to an AXI Full address.
  rpc AXIFullWrite(AXIFullWriteRequest) returns (AXIOperationStats);

  // Reset the AXI Full interface.
  rpc AXIFullReset(DeviceRequest) returns (StatusResponse);

  // --- AXI Stream ---

  // Get the read and write datapath widths for AXI Stream.
  rpc AXIStreamGetDatapathWidths(DeviceRequest) returns (AXIStreamDatapathWidthsResponse);

  // Read data from the AXI Stream interface.
  rpc AXIStreamRead(AXIStreamReadRequest) returns (AXIStreamReadResponse);

  // Write data to the AXI Stream interface.
  rpc AXIStreamWrite(AXIStreamWriteRequest) returns (AXIStreamWriteResponse);

  // Reset the AXI Stream interface.
  rpc AXIStreamReset(DeviceRequest) returns (StatusResponse);
}

// ============================================================================
// Server Management Service (ADR-010)
// ============================================================================

// Information about a single manageable service.
message ServiceInfo {
  // Service name (e.g., "rest", "grpc", "mqtt", "mdns").
  string name = 1;
  // Current status: "running", "stopped", "starting", "stopping", "failed", "not_compiled".
  string status = 2;
  // Whether the feature flag was enabled at compile time.
  bool compiled = 3;
  // Whether the service is enabled in the TOML configuration.
  bool enabled = 4;
}

// Request to operate on a specific service by name.
message ServiceRequest {
  // Service name (e.g., "rest", "grpc", "mqtt", "mdns").
  string name = 1;
}

// Response after a service lifecycle operation (start/stop/restart).
message ServiceOperationResponse {
  // Error status for this operation.
  ErrorCluster error = 1;
  // Updated service info after the operation.
  ServiceInfo service = 2;
}

// Response listing all manageable services.
message ListServicesResponse {
  // Error status for this operation.
  ErrorCluster error = 1;
  // List of all services and their current status.
  repeated ServiceInfo services = 2;
}

// Full server status including service states.
message ServerStatusResponse {
  // Error status for this operation.
  ErrorCluster error = 1;
  // Server API version string (e.g., "1.0.0").
  string api_version = 2;
  // Server uptime in seconds.
  uint64 uptime_secs = 3;
  // Number of currently connected FPGA devices.
  int32 device_count = 4;
  // Status of all manageable services.
  repeated ServiceInfo services = 5;
}

// Server and service lifecycle management.
//
// This service provides RPCs for querying server status, managing
// optional services (REST, gRPC, MQTT, mDNS), and restarting the server.
// See ADR-010 for the ServiceManager architecture.
service ServerService {
  // Get detailed server status including uptime and service states.
  rpc GetServerStatus(StatusResponse) returns (ServerStatusResponse);

  // Restart the entire server process.
  // Returns 202 Accepted; the server restarts after sending the response.
  rpc RestartServer(StatusResponse) returns (StatusResponse);

  // List all manageable services and their current status.
  rpc ListServices(StatusResponse) returns (ListServicesResponse);

  // Start a stopped service.
  // Returns an error if the service is already running or not compiled.
  rpc StartService(ServiceRequest) returns (ServiceOperationResponse);

  // Stop a running service.
  // Returns an error if the service is not running.
  // Note: Stopping a service via its own RPC uses the respond-then-stop pattern.
  rpc StopService(ServiceRequest) returns (ServiceOperationResponse);

  // Restart a running service.
  // Equivalent to Stop followed by Start.
  // If the caller is restarting its own service (e.g., gRPC calling RestartService("grpc")),
  // the response is sent before the restart begins (202 pattern).
  rpc RestartService(ServiceRequest) returns (ServiceOperationResponse);
}
