# Automated weekly dependency & security update checks via GitHub Dependabot

version: 2
updates:
  # Rust Cargo workspace dependencies (crates/ok-fpga-ffi, ok-fpga-core, ok-fpga-server)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "rust"
    groups:
      grpc-protobuf:
        patterns:
          - "tonic*"
          - "prost*"
    ignore:
      # tonic 0.14 split ProstCodec into a new tonic-prost crate requiring build.rs refactoring
      - dependency-name: "tonic*"
        versions: [">= 0.14.0"]
      - dependency-name: "prost*"
        versions: [">= 0.14.0"]

  # GitHub Actions workflow versions (.github/workflows/*)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "ci"
