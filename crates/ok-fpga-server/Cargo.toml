[package]
name = "ok-fpga-server"
description = "REST + gRPC server and web dashboard for Opal Kelly FPGAs, powered by FrontPanel 6.1.0"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# ============================================================================
# Feature Flags (ADR-010)
# ============================================================================
#
# Each optional service can be excluded at compile time via feature flags.
# Default features include REST and the web dashboard; gRPC, MQTT, and mDNS
# are opt-in.
#
# Build examples:
#   cargo build                           → REST + dashboard (defaults)
#   cargo build --features grpc           → REST + dashboard + gRPC
#   cargo build --features full           → everything
#   cargo build --no-default-features     → management server only

[features]
default = ["rest", "dashboard"]

# REST API server (Axum). Serves the OpenAPI-defined endpoints on port 8080.
# The REST feature gates the REST API routes module, NOT Axum itself — Axum
# is always required because the management server (always-on) uses it.
rest = []

# Web dashboard SPA served on the management port (9090).
dashboard = []

# gRPC API server (Tonic). Serves the proto-defined services on port 50051.
grpc = ["dep:tonic", "dep:prost"]

# MQTT status publisher. Publishes device/service events to an external broker.
mqtt = ["dep:rumqttc"]

# mDNS/DNS-SD service discovery. Advertises the server on the local network.
# Uses dns-sd-native (OS daemon) as primary, mdns-sd as fallback (ADR-027).
mdns = ["dep:dns-sd-native", "dep:mdns-sd", "dep:local-ip-address", "dep:windows", "dep:widestring", "dep:windows-strings"]

# Convenience: enable all optional features.
full = ["rest", "dashboard", "grpc", "mqtt", "mdns"]

# ============================================================================
# Dependencies
# ============================================================================

[dependencies]
# --- Always required ---

# The core crate contains all domain logic (device management, resources,
# service manager, etc.)
ok-fpga-core = { path = "../ok-fpga-core" }

# The FFI crate provides low-level access to the FrontPanel C API.
# Used by the scanner module to enumerate connected FPGA devices at startup.
ok-fpga-ffi = { path = "../ok-fpga-ffi" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }

# Async stream utilities — used by both SSE (REST events) and gRPC streaming.
tokio-stream = { version = "0.1", features = ["sync"] }

# Base64 encoding/decoding for pipe data transfer in REST handlers.
base64 = "0.22"

# TOML parsing for server configuration files.
toml = "0.8"

# Hostname resolution for mDNS service registration.
hostname = "0.4"

# Axum is the HTTP framework for BOTH the management server (always-on,
# port 9090) and the REST API server (optional, port 8080).
axum = { version = "0.8", features = ["ws", "multipart"] }

# Tower provides middleware (logging, timeouts, CORS, etc.) used by the
# management server and REST API.
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# --- gRPC feature dependencies ---

# Tonic is the gRPC framework — it generates Rust server code from our
# .proto file and handles all gRPC transport.
tonic = { version = "0.13", optional = true }
prost = { version = "0.13", optional = true }

# --- MQTT feature dependencies ---

# rumqttc is a pure-Rust async MQTT v5 client. Used to publish status
# messages to an external broker (e.g., Mosquitto).
rumqttc = { version = "0.24", optional = true }

# --- mDNS feature dependencies ---

# dns-sd-native delegates mDNS registration to the OS daemon (Windows:
# dnscache via DnsServiceRegister, Linux: avahi-daemon via D-Bus).
# Primary registration path per ADR-027. On Linux, Avahi handles A/AAAA
# records automatically. On Windows, we bypass the builder and call Win32
# DnsServiceConstructInstance directly with pIp4 (ADR-027 addendum).
dns-sd-native = { version = "0.1", optional = true }

# mdns-sd is a pure-Rust mDNS/DNS-SD library. Used as fallback when the OS
# daemon is not running (no port conflict in that scenario). Also used by
# client-side GUI demos for browsing.
mdns-sd = { version = "0.13", optional = true }

# local-ip-address resolves the machine's primary LAN IPv4 address.
# Used by the mDNS registration to include A records in DNS-SD responses
# (ADR-027 addendum: dns-sd-native omits them, Windows dnscache requires
# explicit pIp4 to include A records).
local-ip-address = { version = "0.6", optional = true }
md5 = "0.8.1"

# ============================================================================
# Platform-Specific Dependencies
# ============================================================================

# On Windows, we call DnsServiceConstructInstance directly (bypassing
# dns-sd-native's builder) to include the A record (pIp4). See ADR-027
# addendum. The version and features match dns-sd-native's own dependency.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_NetworkManagement_Dns",
    "Win32_System_SystemInformation",
], optional = true }
widestring = { version = "1.2", optional = true }
windows-strings = { version = "0.5", optional = true }

# ============================================================================
# Build Dependencies
# ============================================================================

[build-dependencies]
# tonic-build compiles .proto files into Rust gRPC server/client code
# at build time. It uses protoc under the hood.
# Always present so `build.rs` can conditionally compile protos.
tonic-build = "0.13"
