[package]
name = "ok-fpga-server"
description = "REST + gRPC server and web dashboard for Opal Kelly FPGAs, powered by FrontPanel 6.1.0"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# ============================================================================
# Feature Flags (ADR-010)
# ============================================================================
#
# Each optional service can be excluded at compile time via feature flags.
# Default features include REST and the web dashboard; gRPC, MQTT, and mDNS
# are opt-in.
#
# Build examples:
#   cargo build                           → REST + dashboard (defaults)
#   cargo build --features grpc           → REST + dashboard + gRPC
#   cargo build --features full           → everything
#   cargo build --no-default-features     → management server only

[features]
default = ["rest", "dashboard"]

# REST API server (Axum). Serves the OpenAPI-defined endpoints on port 8080.
# The REST feature gates the REST API routes module, NOT Axum itself — Axum
# is always required because the management server (always-on) uses it.
rest = []

# Web dashboard SPA served on the management port (9090).
dashboard = []

# gRPC API server (Tonic). Serves the proto-defined services on port 50051.
grpc = ["dep:tonic", "dep:prost", "dep:tokio-stream"]

# MQTT status publisher. Publishes device/service events to an external broker.
mqtt = []

# mDNS/DNS-SD service discovery. Advertises the server on the local network.
mdns = []

# Convenience: enable all optional features.
full = ["rest", "dashboard", "grpc", "mqtt", "mdns"]

# ============================================================================
# Dependencies
# ============================================================================

[dependencies]
# --- Always required ---

# The core crate contains all domain logic (device management, resources,
# service manager, etc.)
ok-fpga-core = { path = "../ok-fpga-core" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }

# TOML parsing for server configuration files.
toml = "0.8"

# Axum is the HTTP framework for BOTH the management server (always-on,
# port 9090) and the REST API server (optional, port 8080).
axum = { version = "0.8", features = ["ws"] }

# Tower provides middleware (logging, timeouts, CORS, etc.) used by the
# management server and REST API.
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# --- gRPC feature dependencies ---

# Tonic is the gRPC framework — it generates Rust server code from our
# .proto file and handles all gRPC transport.
tonic = { version = "0.13", optional = true }
prost = { version = "0.13", optional = true }
tokio-stream = { version = "0.1", optional = true }

# ============================================================================
# Build Dependencies
# ============================================================================

[build-dependencies]
# tonic-build compiles .proto files into Rust gRPC server/client code
# at build time. It uses protoc under the hood.
# Always present so `build.rs` can conditionally compile protos.
tonic-build = "0.13"
